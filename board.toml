schema_version = 2

[board]
name = "sm-t970"
soc = "SM8250"
soc_source = "sm8250"
os_profile = "ipados-17.7.11-21H461"
description = "Samsung Galaxy Tab S7+ Wi-Fi (SM-T970, gts7xlwifi), single-core platform bootstrap"
kit = "sm-t970"

[components]
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "ShengUfs", "VirtioMmioBlock", "XnuPrelink", "DarwinBoot"]

[kernel]
archives = ["build-corecrypto-14.py", "build-corecrypto-14.py --namespace", "component:ArmDTPlatform", "component:ArmCpu", "component:SoftwareAES", "build-verified-root-empty.py", "component:ShengUfs", "build-storage-bindings.py --component NativeUfs --archive libShengUfs.a --directory build/sheng-ufs", "build-ufs-stubs.py", "component:VirtioMmioBlock", "build-software-aes-bindings.py", "build-platform-power.py", "build-mockfs-fixture.py", "build-libpthread-kernel.py"]
defconfig = "sm-t970_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8250.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "device:patches/xnu/os-series", "device:patches/xnu/series"]

[device_tree]
source = "device:dts/sm-t970.dts"
include_dirs = ["soc:dts"]
# Board-checker policy: this ADT span is an envelope, not a free-RAM pool.
memory_policy = "firmware-envelope"

[firmware]
# Stage package/firmware with scripts/prepare-uefi.py first. Inputs are filled
# and host builds are enabled; this T970 firmware has not been booted.
config = "gts7xlwifi"
dsc = "gts7xlwifiPkg/gts7xlwifi.dsc"
fd = "Build/gts7xlwifiPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
packages = ["{uefi}", "{uefi}/Platforms/Samsung", "{uefi}/Common/Mu", "{uefi}/Common/Mu_OEM_Sample", "{uefi}/Silicon/Qualcomm", "{uefi}/Silicon/Silicium", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}"]
submodules = ["Common/Mu", "Common/Mu_OEM_Sample"]

[firmware.defines]
DEVICE_MODEL = "sm-t970"

[payload]
volume = "T970"
size_mib = 56
loader = "firmware"
title = "UniXNU SM-T970 platform bootstrap"
kernel_args = ["-v", "cpus=1", "t970-novc", "sheng-pmgr=2", "native-ufs-root=1"]
# Adds Tools -> Advanced Logger to the generated menu (porting/log-capture).
tools = true
panic_screen = true

[payload.adt]
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"
# Match the loader's existing 256 MiB default explicitly. Allocation still uses
# EfiConventionalMemory, never the complete DTS envelope or reserved holes.
owned_memory_size = "0x10000000"
# Supply the board's identity seed through --unique-chip-id.
# OS identity seed from the selected iPad7,1 profile, not the Qualcomm SoC ID.
chip_id = "8011"
unique_chip_id = "required"

[userdata]
# T970 GPT: userdata LBA 2969600..62458874, logical block 4096.
first_lba = 2969600
last_lba = 62458874
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]
