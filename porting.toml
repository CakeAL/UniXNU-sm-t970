[[area]]
id = "gpu"
status = "planned"
components = []
paths = [
  "evidence/adb-2026-11-01/gpu.txt",
  "docs/gpu-port-plan.md",
  "package/T970Gpu/**",
  "evidence/gpu/**",
  "tests/test_gpu_arc.py",
]
inputs = [
  "KGSL reports Adreno650v3, seven power levels and a maximum clock of 670000000 Hz; the GPU DT chipid is 0x06050002.",
  "GPU register window: 0x03d00000 + 0x40000. GMU register window: 0x03d6a000 + 0x30000; PDC windows are also present in the DT.",
  "a650_gmu.bin is 41548 bytes with SHA256 df79fa8482fcc7587bb239b9c9e2b24bce4729893b990fe3f82b30da8175b01c.",
  "a650_sqe.fw is 31632 bytes with SHA256 b4c27420fd6a5c6b511b254cc0fad8cdd40eea38ceb3418f895a1084f4460487.",
]
configuration = [
  "The diagnostic kernel build takes --gpu-soc to include the locked SM8250 A650GmuPower.h. The v104 payload replaces t970-gpu-w=1 with t970-gpu-p=1.",
  "The live DT records GPU/GMU interrupts, clocks, supplies and SMMU resources; no UniXNU GPU backend or Metal ABI has been selected.",
]
procedure = [
  "Read KGSL identity and frequency nodes, list GPU firmware files and calculate the GMU/SQE hashes without executing GPU commands.",
]
findings = [
  "v120 BOOTe6d8b426 verified installation and rollback of all six context registers, with a 42-leaf walk rooted in hardware TTBR0. v121 qualifies local TLB synchronization and SCTLR.M activation and withdrawal while all SMRs remain empty and CM3 remains in reset.",
  "v119 BOOT9e07061d verified real 64-bit reads, ASID writes and restores on TTBR0 and TTBR1. v120 installs and audits an XNU-owned root with SCTLR.M clear and no streams, and retains backing on uncertain rollback.",
  "v118 BOOT240b2f38 confirmed two CB0 checks and parent release with only the known CBAR residual. v119 compares direct 64-bit TTBR reads with paired 32-bit reads, toggles and restores ASID bit 48 with translation off, then rechecks both roots and all routes.",
  "v118 uses the v117 selector value as a single allowed CBAR residual. It takes two complete CB0 and route readbacks with CM3 in reset, no valid SMRs and no active translation before allowing parent release.",
  "v117 BOOTa9c4860d read CBAR 0x1f300 both before and after the rollback write. VA64 returned to zero. Post-restore guard bit 3 held the dependencies before the full snapshot comparison.",
  "v116 BOOT9ea0a924 audited five tables, 42 leaves and 2560 descriptors on the board. v117 qualifies CBAR Stage 1 readback and rollback with all streams unpublished, SCTLR.M clear and the GMU in reset.",
  "v116 builds and audits inactive 4 KiB GMU/HFI tables using the catalog-pinned ArmSmmu4K and XNU-owned wired backing. The CPU walks the encoded root for five A650 RAM windows. No GPU/SMMU MMIO occurs in mode 13.",
  "v114 BOOTa3c7e5fc isolates the post-set guard to CB0 FSR=0x400, the AArch64 Format field. v115 masks Format in the fault predicate, requires VA64=1 with FSR=0x400 for active readback success, and compares the original raw FSR and all CB0 words on rollback.",
  "v113 BOOTcc2fb731 confirms VA64=1, then hits a post-set idle guard before any restoration. v114 records all guard values with separate-register LDR/UXTW reads, permits exact VA64 rollback after a CBAR-only view change with empty streams and disabled translation, and still requires the full original context on return.",
  "v112 BOOTf9df94f3 confirms the lmi GPU SMMU layout, six zero SMRs, CB0 disabled, no global or CB0 fault and three stable reads. v113 tests only the CBA2R.VA64 format write with real W-register accesses, then compares the full CB0 snapshot.",
  "v111 BOOT50deea9b confirms the 200 MHz RCG configuration 1/100602/1 with UPDATE clear and restored DIV_GATE, RSC, XO and CX. v112 uses the stock DT GPU SMMU clocks and a read-only SMMU/CB0 snapshot. The stock GMU kernel uses SID5 with mask 0x400.",
  "v110 BOOTf8039496 reports both MX and CX TCS1 acknowledgements at 0x10101 and idle IRQ/control state 0/0/1 with RSC, XO and CX restored. v111 qualifies the GPLL0 divided 200 MHz GMU route after both ARC acknowledgements, then restores XO before releasing the temporary DIV_GATE.",
  "v109 BOOT569ebe5f reports wr=ff restore=ff xo=7/7 cx=1/1, verifying the eight SDE, RSC SRAM and PDC writes and their rollback on the board. v110 uses the programmed state to send MX before CX on GPU DRV0 TCS1, with both selector 2 values validated against command DB and parent dependencies retained on uncertain completion.",
  "v108 BOOT25f846a6 confirms DRV0 config 4000000a, ten idle TCS slots, lmi-matching inherited hidden commands and route, zeroed sequence SRAM and PDC 0/100. v109 applies the lmi mode 24 SDE/SRAM/PDC subset under the exact cold-state guard and verifies reverse restoration.",
  "v107 BOOT5354324f shows GMU reset=1 fw=0 ao=1440/6b66 xo=7/7 cx=1/1. The AO counter advanced by 22310 while CM3 remained held. v108 adds a read-only GPU DRV0/TCS and PDC census under that clock and reset state, before any sequencer or vote programming.",
  "v106 BOOTd0a4c191 reports rcg=80000000/1 br=1/1/4221 mask=7/7 cx=1/1. The AHB, CXO and CX GMU branches ran on the inherited XO route, and all votes were restored. v107 rechecks CX and all three branches before a read-only GMU mapping, then samples CM3 reset, FW_INIT and the AO counter in that order.",
  "v105 BOOT4ae3bcd1 confirms the CX pulse: 222001/5ff4 -> f8222000/80001fe0 -> 222001/5ff4, ack=1 restore=1. v106 qualifies the inherited XO source and tests the AHB, CXO and CX GMU branch enables while CX is on. It restores branch votes in reverse order and retains parents when a child vote cannot be restored.",
  "v104 device report on BOOT031095d5 confirms GCC CFG AHB=1 and a readable GPUCC. CX and GX GDSCR=0x222001, CX HW=0x5ff4, and AHB/GMU/SMMU branches report CLK_OFF. v105 therefore exercises CX SW_COLLAPSE alone after guarding the cold software-controlled CX and GX states.",
  "v104 reads the inherited GCC CFG AHB, MEMNOC, DVM and DDRSS AXI branches. It reads the GPUCC CX/GX status and branch clocks only if CFG AHB is enabled and running. GX GDSCR is GPUCC +0x100c and +0x1508 controls the GX clamp.",
  "On BOOT6b124053 the owner photo shows branch=1206d7f div=1 back=1216d7f restore=1, verifying the GCC GPU divided-branch bit can be set and restored. The same snapshot shows eight CPUs, 247 processes and 43 GOP copies and retirements.",
  "The closest XNU references are the MIT T733 Adreno6xx driver (SM7325/A642L, same iPadOS 17.7.11 ABI family: NativeAdreno ABI v1, ring, submit, fences, BO/memory, scheduler, user client) and the MIT lmi-uefi-touch-gpu project (SM8250/A650, iOS 16.5: ARC/RPMh/clock, GMU/HFI, ZAP, CP, SMMU, tile/desktop). Adreno740 is SM8550-only and UniXNU-umi has no GPU backend. The port therefore reuses the A6xx ABI core and writes a new A650 backend from the lmi sequences and the T970 DT.",
  "v99 adds a read-only SM8250 ARC resource parser (cx.lvl/mx.lvl at 0x80860000+0x20000, no RPMh request) and prints GPU arc in the terminal report; GPU/GMU windows are deliberately untouched until clock/power qualification. On BOOT76dd4b32 the line did not appear and Keys was clipped at pon=1: the shared 896-byte display_state buffer was exhausted by the earlier display/UI/Data-space text plus the new Charger cfg and Battery svc lines, so the GPU line had no bytes. The probe markers were linked. v100 raises display_state to 1280 bytes (t970-report-buffer.patch). On BOOT1e1b1936 the complete Keys line and GPU arc db=1 cx=30000 lv=9 min=2 mx=30010 lv=9 min=2 both print: the parser finds nine CX/MX levels with the same minimum-SVS index 2. The level codes themselves were not printed by v100; v101 adds the [..] level lists to the same line (read-only). On BOOT12bf03ae the line reads cx=[0,16,64,128,192,256,320,384,416] min2 and mx=[0,16,128,192,224,256,320,384,416] min2: nine RPMh corner codes per rail, CX/MX diverging at index 2 (64 vs 128) and MX adding 224. The gpu-pwrlevels DT table gives seven GPU frequencies (587/525/490/441.6/400/305/670MHz) but no CX/MX corner index, so the corner mapping still needs the vendor table or the lmi route data. v102 adds a read-only GCC GPLL0/GPU-branch snapshot (MODE/L/ALPHA/USER/STATUS and the 0x52000 branch) to qualify the parent clock before any GPUCC/GDSC write. On BOOTf9905579 the line is gpl0=d810003d/1f/4000/0 branch=1206d7f run=1 post=1 hz=600000000: GPLL0 runs at 600MHz (L31, alpha0x4000), the MODE/running/alpha/post preconditions pass, and the GPU branch has DIV_GATE clear.",
  "Disabled GPU/GMU overrides now preserve the stock named register windows and interrupts. Unverified shared iommus references are removed; no GPU DMA mapping is invented.",
  "Six A650 files include GMU/SQE and the split signed ZAP image.",
  "The measured GPU is A650, so A740 register sequences and firmware cannot be assumed compatible. Presence of a615_zap files alone does not establish which secure firmware the running driver loads.",
  "Known GMU/SQE files and hashes are listed in proprietary-files.txt as inventory only; no GPU component or consumption recipe is enabled.",
  "Step 2 retains the SoC A650Gmu operations as a future reference only. Adreno740 is scoped to A740/SM8550 and AdrenoMetal depends on that backend; neither is selected for T970.",
]
