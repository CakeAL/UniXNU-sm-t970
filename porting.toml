inputs = [
  "Existing ADB and Magisk su can read the live FDT, physical iomem, input capabilities and primary GPT metadata while SELinux remains Enforcing.",
  "Android pstore lists console-ramoops-0 and pmsg-ramoops-0; their contents were not collected.",
  "capture.json records timestamps in Asia/Shanghai, remote commands, exit codes, boot header fields and evidence-file SHA256 values.",
]
configuration = [
  "The collector uses adb -d shell -T to preserve binary bytes and remote exit status. Evidence is an Android inventory snapshot, not an XNU verification run.",
  "scripts/check-platform.py resolves source pins and archive/patch plans, compiles the board DTS and checks an artificial host-only ADT against archived hardware inputs.",
]
procedure = [
  "Run python3 scripts/collect-adb-inventory.py --root --output evidence/<new-capture>; review per-command stderr, checksums, GPT CRC results and DT sanitization before updating this record.",
]
findings = [
  "v119 reports TTBR0 and TTBR1 native read, ASID write and rollback masks through the three-finger startup report.",
  "The v116 three-finger report includes a bounded GMU table-walk result with allocator, backing, build, bind, encode and audit failure labels.",
  "Mode 8 records inherited, active and restored RCG and DIV_GATE values. The GPLL0 calculation is shared with the existing read-only clock report.",
  "Mode 7 prints MX and CX separately, including command status, pending IRQ/control/slot state and the RSC/XO/CX restoration result.",
  "v108 routes both terminal variants through the same GPU reporter and prioritizes RSC/PDC state in mode 5. The ARC and branch write wiring tests still exercise the ordinary diagnostic selection.",
  "The v104 report uses the locked SM8250 register header and checks the inherited CFG AHB state before attempting the read-only GPUCC snapshot.",
  "v91 lock/relight and v92/v93 bus/memory observations are saved with photo and BOOT hashes. v93 avoids shared896-byte report clipping. v94 adds raw/decoded read-only gauge output, PMIC identity checks, validity mask and GPIO restoration result. Full suite ran64 tests:54 passed,10 skipped; actual GPIO-I2C wire, clock, gauge restoration and numeric cases pass ASan/UBSan. DT/ADT checker remains blocked by framework revision drift.",
