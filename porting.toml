summary = "SM-T970/iPadOS21H461 reaches SpringBoard desktop and opens apps. v88 verifies a3840MiB EFI request with3713.86MiB managed and8 CPUs. v90 verifies all3 raw side keys with2/2 press-release edges and0 errors; v91 Consumer HID is under device test. v94 reads the MAX77705 gauge on device (60.49%,3925mV,28.2C) and v95 uploads a read-only IOPMPowerSource service whose runtime result is pending. Full usable8GB, Wi-Fi, brightness, charging, status-bar battery and sustained validation remain unfinished; GPU deferred."

