findings = [
  "v121 validates exact v120 BOOT and changes the FAT kernel and opt-in GPU mode. It verifies ADT, Data seed, trust cache and bytes outside FAT.",
  "v120 validates exact v119 BOOT and changes the FAT kernel and opt-in GPU mode. The packer verifies ADT, Data seed, trust cache and bytes outside FAT.",
  "v119 validates exact v118 BOOT and changes the kernel and GPU diagnostic mode in FAT. ADT, Data seed, trust cache and bytes outside FAT are verified.",
  "v118 starts from exact v117 BOOT, replacing the FAT kernel and changing the opt-in diagnostic mode to 15 while verifying the ADT, Data seed, trust cache and all bytes outside FAT.",
  "v117 validates exact v116 BOOT and switches the diagnostic kernel and mode in FAT with ADT, Data seed, trust cache and bytes outside FAT verified.",
  "v116 starts from exact v115 BOOT and switches the FAT kernel and diagnostic mode. The packer verifies the retained ADT, Data seed, trust cache and bytes outside FAT.",
  "v115 validates exact v114 BOOT and replaces the kernel and GPU mode in FAT. ADT, Data seed, trust cache and bytes outside FAT are preserved.",
  "v114 validates exact v113 BOOT and replaces only the kernel and GPU mode in FAT. ADT, Data seed, trust cache and bytes outside FAT are preserved.",
  "v113 validates exact v112 BOOT and replaces the kernel and GPU mode in FAT. ADT, Data seed, trust cache and bytes outside FAT are preserved.",
  "v112 validates the tested v111 BOOT and replaces the kernel and GPU mode in FAT. ADT, Data seed, trust cache and bytes outside FAT are preserved.",
  "v111 validates the tested v110 BOOT and replaces the kernel and GPU mode in FAT. ADT, Data seed, trust cache and bytes outside FAT are preserved.",
  "v110 validates exact v109 BOOT and replaces only the kernel and GPU diagnostic mode in FAT. The ADT, Data seed, trust cache and bytes outside FAT are preserved.",
  "v109 validates exact v108 BOOT and replaces the kernel and GPU diagnostic mode in FAT. The ADT, Data seed, trust cache and bytes outside FAT are preserved.",
  "The v108 packer validates exact v107 BOOT and replaces the kernel and t970-gpu-p value in FAT. ADT, Data seed, trust cache and bytes outside FAT are preserved.",
  "The v107 packer validates the tested v106 BOOT, then swaps only the kernel and GPU diagnostic mode in FAT. The ADT, Data seed, trust cache and bytes outside FAT are preserved.",
  "The v106 package validates exact v105 BOOT and changes the kernel plus t970-gpu-p=3 in FAT, preserving ADT, Data, trust cache and the bytes outside FAT.",
  "The v105 packer validates exact v104 BOOT and swaps only the kernel and GPU mode in its FAT. ADT, Data seed, trust cache and bytes outside FAT are preserved.",
  "v104 replaces only the XNU kernel and GPU diagnostic argument in the verified v103 BOOT FAT. ADT, Data seed, trust cache and the bytes outside FAT are preserved.",
  "v93 BOOTbb5bd9d0 and v94 BOOT6d5c4c60 were uploaded to BOOT only with Heimdall success and reboot requested. v94 keeps the exact v93 ADT, Data seed, trust cache, Android-v2 header, firmware, DTB and partition tail; only kernel and battery probe mode2-to3 change. Preparation manifests preserve compiled source snapshots and hashes; upload success is separate from readback and runtime success.",
  "The display relinker now optionally adds the PMIC key object and refreshes the separate Consumer HID wrapper, with original21H461 vtable bindings rechecked after prelink. v88..v92 preserve the exact Android-v2 header, firmware, firmware-DTB and partition tail and audit FAT kernel/ADT/config/seed/trust changes independently. v91 is uploaded; v92 with read-only battery-bus and64-bit owned-window reports is prepared. Every new image, receipt and available owner observation is kept together under evidence; generated binaries remain ignored.",
  "BOOTbb4d8474 owner observed Apple logo; photo14:40:13 shows swap2/0, transfer2, copies2, retire2. BOOT08b90255 previously panicked on uninitialized vc_progress_lock via first swap console handoff. Guard now matches t970-novc bootstrap. SpringBoard sample reaches LaunchServices database context from Control Center module discovery; sustained desktop pending. See evidence/display/display-novc-v24.",
  "BOOTe44011cb photo03:08:38 links BB wait to QuartzCore CAMetalContextCreate polling IOAcceleratorES, at most 300 sleeps of 100ms; SB waits for main screen info, open6/swap0. T733 48f documents CPU frames through NativeLegacyDisplay. BOOT08b90255 keeps kernel and changes report target to 125s; FAT comparison passes, ADT differs only in random-seed. See evidence/display/ui-cpu-fallback-v23.",
  "BOOT5385b6ce owner photo03:00:42 shows three pending queues drained, MG done134, BB161, SB75->78, display open6/fail0/swap0. No constrained head means Q cap zero is absent data, not a measured cached limit. v22 reuses exact v21 kernel with existing stack mode1 to locate current BB/SB main waits; host image checks pass, hardware stack result pending.",
  "v21 BCM2837 EDGE width fallback uses registered SMP CPU/cluster counts only when E/P counts are both zero. Previous BOOT705d4160 has all eight ADT CPU cluster-type absent (SMP), cached constrained cap0 and callback progress. Actual prepared-function ASan/UBSan tests cover SMP1/8, E/P precedence and non-BCM guard; kernel/prelink/FAT checks pass. BOOT5385b6ce hardware result pending; this is not validated heterogeneous scheduling or desktop. See evidence/display/edge-smp-v21.",
  "BOOT705d4160 mode6 owner photo02:38:12 captures all three processes/end marker unclipped. Constrained cap/active/busy=0/0/0; MG done35->37 while BB25/SB53 unchanged across 500ms deadlines. Runtime callback continues; investigate EDGE E/P counts versus current SMP topology before any scheduling change. See evidence/display/ui-queue-progress-v20/device-result.json.",
  "BOOTdb0121c9, b9cc7afb, f6fd6636 and continuous ec912b09 were independently packed and BOOT-only uploaded, with receipts and owner observations kept together. Header v2, exact existing FD/firmware DTB, trust and RAM seed are preserved. New key-state and register diagnostics use opt-in runtime inputs; defaults and partition geometry remain unchanged.",
  "BOOT95accf53 owner photo confirms CPU1 entry3 (matched CPU data and reached common_start boundary); C marker4 not seen. Target10 snapshot main0/n2 is earlier than old120 samples. Added secondary-only common/TCR/table/SCTLR/trampoline markers without changing CPU setup values. See entry-trace/device-result.json and MMU trace records.",
  "Two-core BOOT9d4dc888 observed main1 and106 processes but one CPU available; CPU1 phase4/PSCI0/timer0/SGI0. Reset table, CPU1 affinity and reset handler match. Entry execution remains unconfirmed. Added four diagnostic entry milestones and shortened future target wait to10 seconds; default CPU0 unchanged,8-core not uploaded. See evidence/cpu and docs/smp-bringup.md; source/build checks are not hardware SMP qualification.",
  "BOOT97271e99 photo18:22 confirms launchd main1/err0 and managed pages0x1b709 (~439MiB):512MiB EFI-owned request works. BOOT911a462a new Data build failed AMFI No PMGR because isolated output silently used FirstPassStub. Remove implicit stub, require a reference, audit real PMGR340 slots and reject missing registration symbols/archive members in independent pack checks. Repaired6b83f4e6 uploaded exit0; photo18:42 shows watchdogd PID102 SIGTRAP. Enforced exact-device/writable/APFS mount success gate precedes exec, so Data mount success is inferred, not a Data write/persistence test. Original watchdogd host branch and launchd root-owned watchdog-only policy checks pass with explicit OS API substitutions; policy not applied.",
  "BOOT cfbd84ba photo confirms stage4: ID/VALID/S2CR accepted, direct FAULT restore200ff succeeded without fallback, allRestored/mappingsUnchanged=1 and GFSR=0. Six context states captured; CB0..4 already configured with FSR400 of unknown age, CB73 SCTLR3ab3a706 is not a verified free bank. No context writes, DMA or UFS commands occurred.",
  "Combined field diagnostic BOOT cfbd84ba34fc03b50661b46c9e22fe59c43ba651bca6967da49f1df1ec373e75 prepared from source7ee2918/kernel53e9e68c. Thirteen host tests, input-stable kernel build, independent FAT/arguments/FD checks and DT/ADT check passed. BOOT-only upload exited0; actual VALID/S2CR/restoration/context observations remain pending.",
  "Prepared a combined single-slot field qualification after ee45890a: test VALID only under unchanged FAULT policy; test S2CR only with SMR invalid; restore with a bounded Qualcomm-aware fallback if necessary; compare all protected mappings; only then read six context states. No UFS commands, DMA route grants, queue/context/global/clock/SCM writes. Field results and restore flags still require exact-image device observation.",
  "BOOT ee45890a device photo confirms stage5, inactive SMR56 ID a5 accepted and restored to zero; S2CR remains200ff, restoreOK and mappingsUnchanged are1, GFSR before/after zero and display04 unchanged. This qualifies only inactive ID-field writes, not VALID/S2CR/context/DMA, and contradicts blanket read-only claims for this measured field.",
  "Single-slot SMR ID test BOOT ee45890ab4875987b0e3376b095a64a5d58f1b23177c96b9ea4a996cd8ba9031 prepared from source 41d99e6 and kernel d455be28. Twelve host tests pass; compiled code has exactly two writes to offset958 with DSB after each. Packed FAT/arguments/FD, capacity and DT/ADT checks pass. BOOT-only patched Heimdall upload exited 0; device field acceptance/restoration observation is pending.",
  "Prepared a single-slot inactive SMR ID-field test, based on the complete 933a5d77 handoff observation. Requires exact measured geometry, clean GFSR, controller prerequisites, sole display mapping unchanged and slot 56 equal to zero/200ff. Rechecks mappings, writes only invalid ID a5 at offset958, restores zero and compares protected state; both writes fenced. No VALID/S2CR/CB/GCC/HCI/SCM/DMA changes. Outcome is not yet observed.",
  "BOOT 933a5d77 device screen is confirmed through END slots=87. Corrected SM8250 GCC gate passes; HCE=1 HCS=10f IS=400, both queue run-stop bits set and both doorbells zero, UTRLBA=9b296000. The sole valid SMR 84020820/S2CR 4 exactly matches the captured display SID 0820 mask 0402; preserve slot 04 and CB4. Candidate residues in invalid slots 02/03 are not active routes. No DMA, SCSI or root read was attempted.",
  "Prepared and independently verified BOOT 933a5d776edb2500be5c268b93e64f2cfec53fee6e12cebbb39869a8d7050deb from source 58bdac8 and kernel 147f8d3b; DT/ADT checks passed. Patched Heimdall uploaded BOOT only with exit 0. The new handoff screen and full-table END marker await device observation; no UFS DMA/root success claimed.",
  "Prepared t970-ufs-handoff=1: corrected board-local SM8250 clock diagnostics from Samsung gcc-kona.c, removed SM8550-only memory-PHY GDSC reads, capture all bounded raw SMR/S2CR slots and guarded read-only HCI/queue state. No clock, PHY, SCM, SMMU, DMA or queue writes; use the exact tested baseline FD. Host and device results remain separate.",
  "User confirmed and photographed the expected T970 SMMUv2 RO stop for BOOT 7f729c2a: sCR0=002d0406 ID0=4c017e57 ID1=6000004a ID2=00005111 GFSR=0; 87 groups scanned, 74 context banks, no candidate match for 0060/00e0/04e0. MMIO observation is confirmed; SMR writability, actual UFS routing, DMA and root reads are not.",
  "Prepared BOOT 7f729c2a6ee8ee11b6eb5d4ff7ec23171b261854151578e36737d866a62391e2 from source 23d54b9 and kernel cca9bbb8. Independent FAT/kernel/arguments and packed FD checks passed, as did nine host tests and CPU0 DT/ADT checks. Patched Heimdall uploaded BOOT only with exit 0; device screen/register observation is pending. This is not a UFS/DMA/root-volume success.",
  "Resumed at 47b113f. New default diagnostic t970-smmu-report=1 reads the measured SMMUv2 window before any controller/queue/DMA/root setup and stops on a labeled panic. It retires the unflashed all-slot write scan, separates sCR0 from ID0/1/2, honors EXIDS, and does not treat ignored writes or prior SCM markers as proof that secure-world routes are exhausted.",
  "Uploaded deliberate after-MMU BRK control 150ed5ff9d73d81b17d3f6d32e609b9a9e42fdfe0397da7c5eea7d62f7ce7b4d, using patched Heimdall, exit 0. The device reset at about 50 seconds, matching the reviewed BRK path; original BOOT restoration is still pending. C startup and console behavior are not exercised.",
  "After-MMU BRK control image prepared and extracted from FAT: BRK word, unchanged PE_create_console call, guard bytes, vector branches and preserved IRQ/FIQ slots verified. Eight host tests passed; hardware BRK delivery and the ~50-second timed reset were observed.",
  "Prepared isolated BRK #0 after-MMU-control image 150ed5ff9d73d81b17d3f6d32e609b9a9e42fdfe0397da7c5eea7d62f7ce7b4d; the FAT kernel was independently extracted and the probe instruction at 0xfffffff0073f3370 matches the intended probe. The device reset at about 50 seconds, confirming the deliberate BRK reached the bounded fault terminal.",
  "Added explicit after-MMU BRK control mode to qualify diagnostic execution before C startup. It preserves PE_create_console call bytes, uses the same reviewed fault handlers, and expects the distinct 50-second BRK path. Device execution and fault routing remain unverified until observed.",
  "Guarded image e18c6ca0e905e0e40a2283447a765bdc322bbcc85bf0cb19fe80ec857007be29 did not reset within 60 seconds. Neither PE_create_console return nor a fault terminal is established. Next is a deliberate after-MMU BRK control to qualify the diagnostic path independently of C startup; no spin-loop diagnosis is claimed.",
  "Uploaded guarded PE_create_console return probe e18c6ca0e905e0e40a2283447a765bdc322bbcc85bf0cb19fe80ec857007be29, using patched Heimdall, exit 0. Measured outcome and original BOOT restoration remain pending. Fault outcomes classify early paths and do not by themselves identify the failing function.",
  "Host checks for guarded PE_create_console return passed: eight tests, verified 112-byte guard code and all modified vector/panic branches inside the actual FAT kernel, with IRQ/FIQ/reserved slots unchanged. Runtime outcome and device BRK control remain unverified.",
  "Prepared isolated _PE_create_console after-return image e18c6ca0e905e0e40a2283447a765bdc322bbcc85bf0cb19fe80ec857007be29; the FAT kernel was independently extracted and its branch at 0xfffffff0079b619c matches the intended probe. This preparation record does not establish a device result; see the separately recorded observation for this image hash.",
  "Added an opt-in early-fault diagnostic restricted to PE_create_console return in arm_init on repaired kernel bfb50a1a. It verifies the compiled active-vector selection, preserves IRQ/FIQ/reserved slots, and terminates sync/SError/panic/BRK paths at 20/30/40/50 seconds. This is not a normal kernel, text/register log or device fault result.",
  "Repaired PE_init_printf(TRUE) return checkpoint was not observed (f759eb8085bb67c4a1d2ac02ea18898e6d146118fc790148638f33cfc81cd9a7). User photo shows retained firmware/loader text and entry bars, not a confirmed XNU text log. Restored PE_create_console may stop earlier; old-kernel gc_enable localization cannot be assumed for this new kernel.",
  "Uploaded repaired-console PE_init_printf(TRUE) after-return probe, image f759eb8085bb67c4a1d2ac02ea18898e6d146118fc790148638f33cfc81cd9a7, using patched Heimdall, exit 0. Device return result, text rendering and original BOOT restoration are pending; transfer alone does not verify the repair.",
  "Repaired kernel bfb50a1a009f4dd08d54cb94d6187d768c7a5ef976427abd235756874f38473c compiled, linked and prelinked successfully. Mach-O checks verify PE_init_printf(FALSE) immediately precedes unconditional PE_create_console. Build configuration checks passed for 61 patches and 19 pinned modules; device return probe is pending.",
  "Prepared isolated _PE_init_printf after-return image f759eb8085bb67c4a1d2ac02ea18898e6d146118fc790148638f33cfc81cd9a7; the FAT kernel was independently extracted and its branch at 0xfffffff00794a01c matches the intended probe. This preparation record does not establish a device result; see the separately recorded observation for this image hash.",
  "Human timing of about four seconds for console-state image 670e78ee17a752fc297dc6537a0c98d0074d8d191c599aa065804bd9ae6cb341 supports gc_initialized low bit 0 and PE_putc NULL before gc_enable. This supports missing console initialization under the experimental skip patch, but does not identify the exact faulting instruction.",
  "Replaced the experimental skip-console patch with t970-console-bootstrap.patch: arm_init now always installs PE_init_printf(FALSE) before PE_create_console, restoring callback and console/lock setup rather than continuing with uninitialized console state. Kernel rebuild and prelink passed; the final Mach-O has adjacent unconditional PE_init_printf(FALSE) and PE_create_console calls. Device return checkpoint remains pending.",
  "Uploaded console-state BOOT image 670e78ee17a752fc297dc6537a0c98d0074d8d191c599aa065804bd9ae6cb341, using patched Heimdall, exit 0. Measured reset timing and original BOOT restoration are pending. Upload and host tests do not establish runtime gc_initialized or PE_putc values.",
  "The console-state FAT kernel was independently extracted; the complete 112-byte state code SHA256 matches its generator report. All six host tests passed, including ARM64 execution of the four timing codes and read-only checks. This does not establish tablet state or timing.",
  "Prepared isolated _gc_enable before-call image 670e78ee17a752fc297dc6537a0c98d0074d8d191c599aa065804bd9ae6cb341; the FAT kernel was independently extracted and its branch at 0xfffffff0073c4968 matches the intended probe. This preparation record does not establish a device result; see the separately recorded observation for this image hash.",
  "Added an opt-in, hash-pinned console-state diagnostic copy at the confirmed gc_enable call site. It reads gc_initialized and PE_putc without invoking gc_enable, encodes their combination as 4/14/24/34-second terminal waits, and rejects unknown input kernels. This is not text logging or a device state result.",
  "The user confirmed the gc_enable before-call reset (59dc0bb6944b0295ee20191e85d3add62439ccb21b854a7dc7e02a439ecd7ee9), whereas its after-return probe did not reset. The unconfirmed path is inside gc_enable. Next diagnostic reads gc_initialized and PE_putc at that known reachable call site; no runtime NULL value is claimed yet.",
  "Uploaded the isolated gc_enable before-call probe inside vcattach, image 59dc0bb6944b0295ee20191e85d3add62439ccb21b854a7dc7e02a439ecd7ee9, using patched Heimdall, exit 0. Human checkpoint feedback and original BOOT restoration are pending; transfer does not establish execution.",
  "Prepared isolated _gc_enable before-call image 59dc0bb6944b0295ee20191e85d3add62439ccb21b854a7dc7e02a439ecd7ee9; the FAT kernel was independently extracted and its branch at 0xfffffff0073c4968 matches the intended probe. This preparation record does not establish a device result; see the separately recorded observation for this image hash.",
  "The gc_enable after-return probe in vcattach did not reset (a914135de89584e944eca643528b296043bc38efa323563153e0898f74db6737). Earlier vcattach lock initialization return is confirmed. Next test is immediately before the same gc_enable call to distinguish an internal failure from its preceding path; neither a NULL callback nor a specific exception is established.",
  "Uploaded the isolated gc_enable after-return probe inside vcattach, image a914135de89584e944eca643528b296043bc38efa323563153e0898f74db6737, using patched Heimdall, exit 0. Human checkpoint feedback and original BOOT restoration are pending; transfer does not establish execution.",
  "Prepared isolated _gc_enable after-return image a914135de89584e944eca643528b296043bc38efa323563153e0898f74db6737; the FAT kernel was independently extracted and its branch at 0xfffffff0073c4968 matches the intended probe. This preparation record does not establish a device result; see the separately recorded observation for this image hash.",
  "The user observed automatic reset after arm_usimple_lock_init in vcattach with image 95ff2c91e26b3b125b2ae7f465fe9cfbd97d18bee1583b06e2fff17715db7561. This establishes vcattach entry and lock initialization return, but not screen acquisition or message replay. The next checkpoint is after gc_enable inside vcattach.",
  "Uploaded the isolated arm_usimple_lock_init after-return probe inside vcattach, image 95ff2c91e26b3b125b2ae7f465fe9cfbd97d18bee1583b06e2fff17715db7561, using patched Heimdall, exit 0. Human checkpoint feedback and original BOOT restoration are pending; transfer does not establish execution.",
  "Prepared isolated _arm_usimple_lock_init after-return image 95ff2c91e26b3b125b2ae7f465fe9cfbd97d18bee1583b06e2fff17715db7561; the FAT kernel was independently extracted and its branch at 0xfffffff0073c4894 matches the intended probe. This preparation record does not establish a device result; see the separately recorded observation for this image hash.",
  "PE_init_printf after-return checkpoint inside PE_init_iokit was not observed with image f89deffaac554e9569d8848852fce5cb233aedf841acb99f11fbd8b32d0a86a4. The next unconditional internal checkpoint is after arm_usimple_lock_init in vcattach, before its graphics-state checks. Failure type and exact instruction remain unknown.",
  "Uploaded the isolated PE_init_printf after-return probe inside PE_init_iokit, image f89deffaac554e9569d8848852fce5cb233aedf841acb99f11fbd8b32d0a86a4, using patched Heimdall, exit 0. Human checkpoint feedback and original BOOT restoration are pending; transfer does not establish execution.",
  "Prepared isolated _PE_init_printf after-return image f89deffaac554e9569d8848852fce5cb233aedf841acb99f11fbd8b32d0a86a4; the FAT kernel was independently extracted and its branch at 0xfffffff00794a01c matches the intended probe. This preparation record does not establish a device result; see the separately recorded observation for this image hash.",
  "The InitIOKit before-call probe inside PE_init_iokit did not reset (977fd90de02e3643beaa01082bca713381c6449f8bccecb46fb0ca5a86aa4270). PE_init_iokit entry is confirmed by the earlier probe, so the next boundary is its first call PE_init_printf(TRUE), which tail-calls vcattach in this exact binary. No crypto-provider failure is established.",
  "Uploaded the isolated InitIOKit before-call probe inside PE_init_iokit, image 977fd90de02e3643beaa01082bca713381c6449f8bccecb46fb0ca5a86aa4270, using patched Heimdall, exit 0. Human checkpoint feedback and original BOOT restoration are pending; transfer does not establish execution.",
  "Prepared isolated _InitIOKit before-call image 977fd90de02e3643beaa01082bca713381c6449f8bccecb46fb0ca5a86aa4270; the FAT kernel was independently extracted and its branch at 0xfffffff00794a390 matches the intended probe. This preparation record does not establish a device result; see the separately recorded observation for this image hash.",
  "The user confirmed automatic reset before PE_init_iokit with image 458218bd4e846aad1408daea717d2263aa86d94ae8dac2a364f0c507a12b2421, while the after-return image did not reset. This brackets the unconfirmed path inside PE_init_iokit; the exact failing instruction and fault type remain unknown.",
  "Uploaded the isolated PE_init_iokit before-call BOOT image 458218bd4e846aad1408daea717d2263aa86d94ae8dac2a364f0c507a12b2421 using patched Heimdall, exit 0. Human checkpoint feedback and original BOOT restoration are pending; transfer does not establish execution.",
  "Prepared isolated _PE_init_iokit before-call image 458218bd4e846aad1408daea717d2263aa86d94ae8dac2a364f0c507a12b2421; the FAT kernel was independently extracted and its branch at 0xfffffff00798ca8c matches the intended probe. This preparation record does not establish a device result; see the separately recorded observation for this image hash.",
  "The iokit-return BOOT image uploaded successfully; the user observed no automatic reset. Upload verifies transfer only, not IOKit completion or userland readiness. Original BOOT restoration remains pending.",
  "Prepared isolated _PE_init_iokit after-return image 9b0f8f683db2802cefc30287b206ac33f7c0d3acf480457b9447c53afdf947dd; the FAT kernel was independently extracted and its branch at 0xfffffff00798ca8c matches the intended probe. This preparation record does not establish a device result; see the separately recorded observation for this image hash.",
  "Prepared isolated _sched_startup after-return image 4a5e423389efb142c3c5b8b5afedf98dcc59c7b0db1a29782805c95d8a298721; the FAT kernel was independently extracted and its branch at 0xfffffff00798c8f0 matches the intended probe. This preparation record does not establish a device result; see the separately recorded observation for this image hash.",
  "The isolated probe boot image is 62713856 bytes, within the measured 71303168-byte BOOT limit. Its header/payload sections round-trip; no Data image is included.",
  "The previously uncommitted board console patch is now part of the declared series, for 61 total patches (56 arch, 2 SoC, 2 OS, 1 board). Isolated probe generation reuses the built source kernel and firmware, patches only a payload copy, checks the measured BOOT size limit and leaves board defaults untouched.",
  "The required Mu SEC entry-argument HOB integration is now versioned in package/firmware/patches and inputs.json, independently of the currently retained runtime probe.",
  "The normal bootimg command produced a 3993600-byte header-v2/raw-kernel/separate-DTB firmware-only check image and verified its sections and load addresses. Ramdisk is empty; no XNU kernel/payload or device boot is claimed.",
  "Actual bootimg invocation exposed the pinned upstream BootShim declaring only FD_SIZE in ARM64 image_size. The shared packer now normalizes the header with strict base/size checks; a real header-v2 raw-kernel/separate-DTB firmware-only image packs and unpacks successfully.",
  "The board package now contains a real T970 firmware overlay and build integration; its vendor assets stay local. Kernel board patch series remains empty.",
  "The shared packer now supports observed raw kernel/header-v2/separate-DTB layout, validates DTB/ramdisk addresses and byte content, and has seven passing regression cases. XNU payload inputs are still a later stage.",
  "A second boot-header capture confirms header v2, header_size=1660, page_size=4096, DTB address=0x1f00000, boot DTB bytes=1580275, and separate recovery DTBO geometry. Source boot is Magisk-modified.",
  "The local archive's manifest matches the intended iPadOS 17.7.11 / 21H461 target.",
  "The manifest's product types describe the Apple restore targets; they do not establish SM-T970 compatibility.",
  "The initial format-2 staging layout blocked builds; the completed device input configuration now removes the example flag without claiming a hardware boot.",
  "Step 2 reuses XNU 10063.141.1 / Darwin 23.6.0 and the existing profile kernelcache hash, DriverKit and TrustCache header tags. Source-level ABI scope was reviewed; private ABI and actual prelink remain unverified.",
  "Step 3 example-gate check invoked build kernel and bootimg against the existing configuration; both returned exit 1 with EXAMPLE device repository before building or packaging. No missing input was replaced with a fabricated path.",
  "tools=true only changes the generated menu; the payload/initrd image was not built because XNU kernel and Apple payload inputs are still absent, so the Tools entry and QR export remain unverified on an image.",
  "The full host build chain now completes at this commit: kernel.macho 51908608 bytes b3f9ab34..., payload.img 201326592 bytes a4a0bac8..., boot.img 205320192 bytes 28f3bb9f... and the 3145728-byte FD 4691d86c.... boot.json reports header v2 with ramdisk_bytes 201326592, the captured firmware DTB hash and the built FD hash; payload.json reports the kernel, generated ADT and accepted trust cache.",
  "The build required a two-pass kernel flow (bootstrap compile records, archives, final link/prelink) and a python3 with tomllib on PATH for the archive scripts. No device write or boot was attempted; restore dumps stay in ignored storage.",
  "With the 56 MiB payload the rebuilt boot.img is 62713856 bytes (payload.img 58720256, sha256 a87d42da...; boot.img sha256 d61f416a...) and fits the 68 MiB boot partition. Odin AP tars for the test image and the Magisk restore image were generated in ignored storage; no flash has been performed.",
  "Added t970-skip-video.patch (initialize_screen guarded by t970-novc) and t970-skip-vcattach.patch (PE_init_printf TRUE path uses a null output callback under t970-novc), and changed t970-console-bootstrap.patch to skip PE_create_console under t970-novc. These are diagnostic bypasses, not a replacement console.",
  "Ported the marble-milacy PMGR placeholder: package/ShengPlatformPower.cpp and scripts/build-platform-power.py build the 340-slot original ApplePMGR ABI bridge from the shared 21H461 kernelcache; the framework sheng-platform-power.patch is in the device series and board archives now include build-platform-power.py. The builder's audit passed unchanged-AMFI read/OR/write and original provider dispatch.",
  "Final console diagnostic patch set for this revision: t970-console-bootstrap calls PE_initialize_console under t970-novc so vinfo and the framebuffer mapping exist for the panic screen, and the t970-skip-video patch (which skipped gc_initialize and left VCPUTC's ticket lock uninitialized) is removed. t970-skip-vcattach keeps PE_putc a null writer.",
  "scripts/build-owner-systemos-policy.py signs and fully verifies the raw Cryptex1,SystemOS member (806400 blocks, b4908cde) against the same owner anchor; it is the missing SystemOS half the framework's --include-systemos bundle needs.",
  "Added scripts/build-verified-root-empty.py (real VerifiedRoot crypto with a zero-length policy table, 19 KB archive, fixed at link time) and scripts/build-ufs-stubs.py with package/UfsStubs.c. The VerifiedRoot probe archive with the 47 MiB hash table stays out of the kernel because it does not fit the 68 MiB BOOT partition.",
  "patches/xnu/t970-smmu-dump.patch is appended to the device series after the console and vcattach patches; it targets the end of arm_init (before machine_startup) so it stays clear of the console hunks.",
  "package/ShengUfs/ keeps the vendored alioth driver next to the board package; scripts/zz-build-shengufs-local.py compiles it against the kernel ABI and would replace the component archive when enabled. Both are deliberately not selected in the current archive list.",
  "package/ShengUfs is now the active driver copy: SmmuTakeover.h reads IDR0/1/2 at 0x0/0x4/0x8 with log2 geometry and NativeUfs.cpp adds the t970-ufs-auto-stream reuse scan; scripts/zz-build-shengufs-local.py builds the archive and must run after any component build to avoid duplicate objects.",
  "patches/xnu/t970-smmu-dump.patch now carries the t970-smmu-write probe (IDR stability read plus a GFSR write-1-to-clear readback) instead of the stream table dump; it is a guarded arm_init diagnostic only.",
  "package/ShengUfs now follows the Linux-validated SMMU layout again (IDR 0x20/0x24/0x28, NUMSMRG/NUMCB) and carries the 128-slot auto-stream scan; the local archive remains the active build input.",
  "package/ShengUfs/NativeUfs.cpp adds t970-ufs-no-smmu=1, which still maps the SMMU window (the caller dereferences it) but skips every SMMU write; the earlier early-return variant crashed in hostBringUp and is not kept.",
  "The generated PHY table header and its generator live under package/firmware/Platforms/Samsung/gts7xlwifiPkg/Library/PlatformUfsLib/ with a GPL-2.0 provenance comment; docs/firmware-ufs-plan.md records the remaining work.",
  "package/firmware carries PlatformUfsLib (BoardInit.c, PlatformUfsLib.inf, Sm8250UfsPhyTables.h), DSC/FDF entries for UfsDxe, and a single merged UfsDxe source patch (ChipInfo tolerance plus 0x9ff80004 stage words). The firmware staging must run scripts/prepare-uefi.py from a reset checkout because same-file patches cannot overlap.",
  "patches/xnu/t970-smmu-dump.patch now carries the t970-ufs-status probe that maps 0x9ff80000 and panics with the firmware stage word; it is the kernel half of the firmware visibility path.",
  "PlatformUfsLib now links ArmSmcLib, ArmMmuLib-free DxeServicesTableLib and BaseMemoryLib; the SCM prototype lives in BoardInit.c next to the PHY replay and is selected by the same DSC/FDF entries.",
  "The post-survey evidence records the survey BOOT build (c404ce26 from revision 09bff63) and a zero-byte read log, with userdata_written=false and recovery_written=false for that action.",
]
