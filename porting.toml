  { kind = "device", reference = "evidence/power/battery-config-v96/device-result.json", revision = "7882975302eec699bbac7fb2b4900a0156c0f29e", command = "BOOT3ce997f2; owner three-finger photo2026-11-07T13:43:20+08:00", result = "Charger cfg 15/5e/13/ec/3b: wdtEn1 chgEn0 ichg1500mA iin1500mA cv13 (4350mV), CHGPROT3. The mode is already 5 but the master enable is clear, so charging is disabled independently of the expired watchdog. Battery svc samples44 errors0 published1 age2759ms; 61.25%, 3932343uV, -2343uA, 28199mC, 5510/8710mAh. No status bar in this photo and no charger write performed." },
