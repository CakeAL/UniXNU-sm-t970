[[area]]
id = "diagnostics"
status = "implemented"
components = []
paths = [
  "evidence/bring-up/runtime/**",
  "tests/**",
  "evidence/device-repository/platform.log",
  "scripts/**",
  "evidence/README.md",
  "evidence/adb-2026-11-01/capture.json",
  "evidence/adb-2026-11-01/diagnostics.txt",
  "evidence/platform-bootstrap/result.json",
  "evidence/platform-bootstrap/dtc.txt",
  "evidence/platform-bootstrap/README.md",
  "evidence/shared-support/result.json",
