  "evidence/input/touch-events-v75/**",
  "evidence/input/touch-rails-v73/**",
  "evidence/input/touch-power-v74/**",
  "evidence/input/touch-id-v72/**",
  "evidence/input/touch-clock-v71/**",
  "package/T970Touch/**",
  "evidence/input/touch-bus-v70/**",
  "evidence/display/springboard-dim-continuous-v69/**",
  "evidence/adb-2026-11-01/input.txt",
]
inputs = [
  "Touch binds to fts_touch (stm,fts_touch), I2C bus 4 address 0x49 on controller 0x994000. DT IRQ GPIO is 15, with irq_type 0x2008.",
  "Touch DT supplies are pm8150_l14 and pm8150_l13; firmware path is tsp_stm/fts1ba90a_gts7xl.bin. Android touch axes span X 0-1751 and Y 0-2799.",
  "S Pen binds to wacom_w90xx (wacom,w90xx), I2C bus 9 address 0x56 on controller 0x88c000. DT IRQ GPIO is 136 and firmware path is epen/w9021_gts7xl.bin.",
  "Wacom DT max_coords=<0x5880 0x3750>, max_pressure=4095 and invert=<0 1 1>; GPIO keys, power-key and hall inputs are also enumerated.",
]
configuration = [
  "The live DT records GENI I2C resources, supplies, IRQs and coordinate transforms; no XNU HID or touch component has been selected.",
]
procedure = [
  "Read /proc/bus/input/devices, getevent -lp and bound I2C driver links; correlate them with the exact touch and Wacom DT nodes.",
]
findings = [
  "v91 BOOT65026b21 owner confirms short power locks and relights the screen. Photo12:30:44 shows power4/4,up14/14,down30/30,mask0,errors0,hid1/97/0. Volume keys react but volume adjustment is unavailable; lack of audio backend remains a hypothesis. v92/v93 retain HID; v93 has hid1/15/0 with no input errors.",
  "v91 owner report and photo on BOOT65026b21 confirm power lock and screen-on, reacting volume keys, power4/4/up14/14/down30/30, released mask0,18626 samples,0 errors and97 successful HID reports(status0). The97 reports match96 key edges plus initial neutral. System volume adjustment is unavailable; actual volume changes and the suspected audio-backend cause are unverified. Hardware suspend/resume is not claimed.",
  "After v90 confirmed all three raw keys, v91 BOOT65026b21 with a separate Consumer HID service was uploaded and rebooted successfully. OS volume, lock and screen-on feedback are pending; transfer is not functional verification.",
  "v90 owner photo on BOOTf72005c4 confirms all three raw keys2/2, released mask0, arbiter0x50010000, PON APID13, GPIO3 APID0x51,15197 samples and0 errors; main1/cpu8/sec7/pages0xe81db. This verifies raw key input only, not OS Consumer HID or wake.",
  "An additional opt-in t970-keys-hid=1 implementation now publishes a separate keyboard/Consumer HID service while preserving the digitizer descriptor and audited207-slot/208-byte IOHIDDevice base ABI. v91 compiled/prelinked and the actual original-family bindings rechecked successfully; packed BOOT65026b21 is unflashed pending v90 raw GPIO qualification. OS volume/lock/wake results remain unknown.",
  "v89 owner photo on BOOT7b32d372 confirms arbiter0x50010000, power2/2, volume-down2/2,13804 samples and0 errors; volume-up stays asserted with0/0. The GPIO binding uses one-based physical numbering, so GPIO3 maps to PPID0x4c2, not0x4c3. v90 BOOTf72005c4 changes that address only and is uploaded for confirmation.",
  "v89 links the opt-in SPMI observer to display startup and the manual runtime report. The stock SM8250 driver establishes that core+4 is INT_EN, 512 APIDs fit the DT core window, and PM8150 PON key bits are 0/1. Foreign-EE mappings are refused. Bounded formatting, ownership, timeout/error and debounce vectors pass ASan/UBSan; real key counts and HID remain pending.",
  "Side buttons map to the PM8150 PON (power, volume down) and PM8150L SPMI GPIO 3 (volume up, active low) from the live DT and the Android input devices. The SM-T970 SPMI arbiter is at core 0xc440000, chnls 0xc600000, obsrvr 0xe600000, intr 0xe700000, cnfg 0xc40a000 with periph_irq on PDC pin 1; PPIDs are 0x008 (PON) and 0x4c3 (PM8150L GPIO3). sheng, mondrian and alioth provide the read-only observer protocol and HID report 2 mapping. The version-5 observer protocol and key-mask decoding now have a host test against a software arbiter model; nothing has been run on the device.",
  "The opt-in v77 Setup capture timestamps the latest FTS press before HID submission and records display counters at that point. v77 retains the v76 HID archive object.",
  "v76 enables the board FTS polling worker and 21H461 HID digitizer in a continuous image. The owner advanced past Hello with a physical swipe. This verifies end-to-end finger event delivery for the tested gesture.",
  "v75 records one scan echo, 28 presses, 356 moves, 27 releases and 27 complete same-ID drags after physical swipes. Scan-off and GPIO restoration succeed. The display service is published with zero GOP copies at this terminal checkpoint.",
  "v73 confirms L13A 0x40a00, L14A 0x42100 and empty ACTIVE TCS0/1. v74 sends the stock voltage, HPM and enable sequence with an isolated TCS1. Both triplets acknowledge; the lines rise and GPIO I2C returns 53 54 39 36 03 with STOP and restored pin controls. Finger events and HID remain unverified.",
  "The Tab S6 mainline fts1ba90a driver matches the exact identity and SEC touch event layout (16-byte records, event type in the low two bits). Use its scan/FIFO protocol reference. Umi and T733 are separate XNU HID and integration references.",
  "v72 temporarily releases the GPIO12/13 pull-downs while SE5 is off. Neither line rises. The probe correctly skips its bounded GPIO identity transfer and restores the pin controls. No ACK or sensor power state can be inferred.",
  "v71 temporarily enables SE5 and verifies firmware 0x303 (I2C protocol 3), FIFO interface disabled, and status 0. The owner photo confirms restored clock control bits. No sensor transaction was performed.",
  "The stock fts1ba90a family uses command 0x22 followed by a five-byte identity read, expected bytes 39 36, and 16-byte FIFO records. The T970 firmware name and stock board wiring match this reference. v70 first samples GCC branch state and GPIO12/13/15 without transactions. It skips the GENI engine if any required clock reports off.",
  "v69 owner reports swipe and power-key presses do not affect the visible Hello screen. No XNU touch or key service has been wired for this image. Stock Android enumerates KEY_POWER on PM8150 PON separately from touch.",
  "SM-T733 uses Focaltech over GENI SPI and separate PMIC-key and HID bridges. Its 21H461 touch HID descriptor and original IOHIDEventDriver dispatch bindings are ABI references; its Focaltech transactions, hardware geometry and key wiring need a separate board match.",
  "T970 touch I2C uses QUP SE5 at 0x994000 and GPIO12/13, with the stock GPI0 controller at 0x900000 and SMMU SID 0x5b6. The hardware-tested umi ST FTM5 path uses SE at 0xa94000 and a different GPI wrapper. Compare the exact T970 chip identity and event format before reusing the transport or HID path.",
  "The actual boot kernel contains all three named input firmware blobs. A unique common image base and 24-byte builtin_fw layout are reconstructed through AArch64 RELATIVE relocations; source offsets, lengths and SHA256 are recorded in builtin-firmware.json.",
  "The disabled board I2C nodes describe measured controller/IRQ resources and input firmware names/coordinate properties; clock/regulator/HID implementations remain planned.",
  "The filesystem-only capture did not find the three input assets; the subsequent builtin-kernel inspection above resolves their source and hashes.",
  "The bound touch driver is STM FTS; the template's Novatek implementation is not established as compatible. Wacom reports a separate input device and requires its own protocol handling.",
  "Step 2 keeps ShengNovatekTouch, QcomGeniSpi and ShengHidInput unselected: their Novatek/SPI/sheng dependencies do not match the measured STM FTS/I2C and independent Wacom input paths.",
]
completion = [
  "Touch contacts preserve stable IDs and releases, coordinates map correctly to the display, and keys/pen produce the expected HID reports.",
]
limits = [
  "The powered identity read, raw finger events and Hello gesture are device-verified. Full coordinate calibration, pen and power-key behavior remain unverified.",
]
next_action = ["Keep the verified PMIC bits0/1 and GPIO3 one-based PPID0x4c2 mapping. Validate OS volume values and audible output after an audio route exists; lock/relight is already confirmed, hardware sleep is not."]
