  { kind = "source", reference = "configs/sm-t970_defconfig", result = "Single-core stage disables native UFS, GPU and display paths." },
  { kind = "source", reference = "unixnu.lock", result = "Resolved SoC Git source lock generated by unixnu fetch." },
  { kind = "host", reference = "evidence/platform-bootstrap/result.json", command = "python3.14 scripts/check-platform.py --unixnu ../UniXNU", revision = "5cab8f372a491af149ce27df02d918f6ac8cddba", result = "PASS: committed source pins and archive/patch plans resolve; CPU0-only DT/ADT bindings match captured CPU/GIC/timer resources and all 30 static reservations. No XNU build or boot is claimed." },
