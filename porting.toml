  "Uploaded the isolated arm_usimple_lock_init after-return probe inside vcattach, image 95ff2c91e26b3b125b2ae7f465fe9cfbd97d18bee1583b06e2fff17715db7561, using patched Heimdall, exit 0. Human checkpoint feedback and original BOOT restoration are pending; transfer does not establish execution.",
  "Prepared isolated _arm_usimple_lock_init after-return image 95ff2c91e26b3b125b2ae7f465fe9cfbd97d18bee1583b06e2fff17715db7561; the FAT kernel was independently extracted and its branch at 0xfffffff0073c4894 matches the intended probe. The device reset at about 50 seconds, confirming the deliberate BRK reached the bounded fault terminal.",
  "PE_init_printf after-return checkpoint inside PE_init_iokit was not observed with image f89deffaac554e9569d8848852fce5cb233aedf841acb99f11fbd8b32d0a86a4. The next unconditional internal checkpoint is after arm_usimple_lock_init in vcattach, before its graphics-state checks. Failure type and exact instruction remain unknown.",
