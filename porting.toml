]
configuration = [
  "board.toml uses schema_version=2, name/kit=sm-t970, soc=SM8250, soc_source=sm8250 and os_profile=ipados-17.7.11-21H461.",
  "Complete component selection: ArmDTPlatform, ArmCpu, SoftwareAES, XnuPrelink and DarwinBoot. The inherited archive list is preserved.",
  "Config fragments are ARM64 common, SM8250 and iPadOS in that order, followed by sm-t970_defconfig. Patch series are arch, soc, os, device; arrays replace inherited arrays.",
