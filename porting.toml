inputs = [
  "DRM controller is ae00000.qcom,mdss_mdp; DSI-1 advertises 2800x1752 modes at 120 and 60 Hz. Android wm reports physical size 1752x2800 and density 340.",
  "Panel sysfs reports SDC_801417. The selected boot argument is msm_drm.dsi_display0=ss_dsi_panel_S6TUUM3_AMSA24VU01_WQXGA:.",
  "The selected S6TUUM3 DT panel declares dsi_cmd_mode, DCS brightness control, max level 355, four data lanes and 24 bits per pixel.",
]
configuration = [
  "The unbooted UEFI overlay uses the measured 2800x1752 panel geometry and original Display Reserved base; SimpleFb stride/pixel format and actual GOP service require hardware validation. No XNU display component is selected.",
]
procedure = [
  "Collect DRM modes, panel type and brightness limits; read only display-selection tokens from /proc/cmdline and match the selected S6TUUM3 node in the live DT.",
]
findings = [
  "The v119 opt-in diagnostic archive adds the pinned ArmSmmu4KMmio object for the GPU TTBR width probe.",
  "The opt-in v116 build routes GPU mode 13 through the startup report and links the five pinned ArmSmmu4K objects in the diagnostic display archive.",
  "GPU report mode 8 replaces the ARC inventory with the GMU rate and restoration report in the terminal buffer.",
  "GPU report mode 7 replaces the ARC table text with the bounded TCS vote report in the existing startup buffer.",
  "The v108 GPU RSC report takes the existing ARC summary slot in the shared terminal buffer, preserving the frame counters and the two display report entry paths.",
  "The v104 diagnostic uses the existing peripheral report slot for a bounded GPU power snapshot and retains the v103 GOP and HID boot baseline.",
  "v93 prioritizes peripheral diagnostics within the existing 896-byte display report to avoid clipping Memory/Battery lines. The v91 owner confirms power-key lock/relight; hardware panel power-off and brightness are still separate unverified functions. The long magenta-to-logo interval has no phase timestamps yet, so memory size, I/O or probe delays are not established causes.",
  "The active S6TUUM3_AMSA24VU01 panel uses DSI command-mode brightness. The stock normal gamma-mode2 function writes DBV low byte then upper3 bits and changes smoothing state; the UI range1..355 is not a raw linear DBV range. No brightness command has yet been sent by XNU.",
  "v84 boots to the iPadOS home screen. The Data seed marks Setup done, so Setup.app never launches (exec 0/0/0), and SpringBoard PID 27 draws the status bar and icons with 277 swaps, 276 CPU copies at 42531/49297 us and zero rejections. The frame copy stays at about 43 ms. The owner reports that apps open and display correctly, but launching takes some time; no app-side frame, copy or memory sample exists yet. Brightness control and sustained animation remain unobserved.",
  "v84 follows the framework skip-setup guide: the v83 kernel and arguments stay, only the packed Data seed changes so com.apple.purplebuddy marks Setup done and com.apple.migration records 21H461, with auto-dim disabled. BOOT215edec4 was uploaded with a requested reboot; the SpringBoard result is pending.",
  "v83 links a GopFramebuffer fork off cf3b429: t970-fb-wc=1 maps the scanout write-combined and t970-fb-cached=1 maps the source copyback with a flush_dcache64 before the read, both off by default. Host tests, object audit (22 globals unchanged, only _flush_dcache64 added), prelink and FAT readback pass; BOOTb739e1ca was uploaded with a requested reboot. On the transfer page the copy fell from 326897/331681 us to 46419/69991 us, about 422 MB/s; 1157 copies in 485 s give about 2.4 frames per second, and the copy now takes only 11% of the 0.42 s frame. Setup still holds four waiting threads, accountsd and akd stay idle, the page still does not advance, and the LaunchServices lock shows two waiters with owner 0x11c5 unsampled.",
  "v82 keeps the v81 arguments and replaces the timed report with a manual one: the HID delivery loop requests a single report after exactly three contacts stay active for two seconds, and that request then samples Setup, SpringBoard, backboardd, lsd, accountsd and akd with up to six Setup threads. The owner triggered it on the transfer page. Setup had four threads: two in CFRunLoop, one waiting for a dispatch_mach reply and one idle workqueue thread; accountsd and akd were idle in CFRunLoop, so the spinner is not an account-service block. The report kept 548 full-frame copies of 19.6 MB at about 327 ms each while only 366x176 changed, so the fixed copy cost dominates interaction. Setup also reports exec=2/394/0 exit=1/273/9 reason=10/0x5bc1ea44, so the language-change restart killed Setup and relaunched it as PID 394.",
  "v81 allows the exact 21H461 SpringBoard relaunch. The owner completed language selection and reached Transfer Your Apps & Data. Selecting no transfer produced a persistent spinner and the interface remained slow. No frame or thread sample is available for that transition.",
  "v80 reproduces SpringBoard SIGKILL on the plain-copy baseline. The reason is SpringBoard namespace 10 code 0x5bc1ea44, flags 5 and jetsam flags 0. The constant resolves to SBRestartManager _doRestartForTransition: in the 21H461 shared cache. A later photo shows a timeout in task_restartable_ranges_synchronize. Its relationship to the earlier diagnostic panic is unverified.",
  "v79 builds and packs an opt-in Setup lifecycle recorder on the plain-copy v77 baseline. The compact report can select the recorded SpringBoard lock owner by TID, capture the last launchd exec result and process exit reason, and retain the v77 frame and storage diagnostics. Device testing is pending.",
  "v78 adds sheng-fb-diff=1 to the exact v77 kernel. After a language tap, SpringBoard PID 27 exits with raw wait status 0x9. The linked kernel stack reaches exit_with_reason via postsig_locked and bsd_ast. The configured exit panic preempts the timed report. Sender and copy latency remain unobserved.",
  "v77 records 15 accepted swaps and copies at the latest FTS press, then 18 accepted, copied and retired frames at target360, with zero rejections. The last copy took 265972 us and the maximum was 292623 us. The latest frame completed 10868 ms after the press. No Setup process was sampled. The known LaunchServices lock recorded one waiter and an owner outside the captured threads.",
  "v76 advances from Hello to the next Setup page via real touch. The owner reports slow screen updates and an apparent stall after tapping a language. No v76 frame cadence or stall snapshot has been captured.",
  "v68 compares matched RAM-Data BOOT images with and without the three SpringBoard idle/dim preferences used by Sirius. The 21H461 cache has direct references from SBIdleTimerDefaults and SBPowerDefaults. The BOOTs share kernel, ADT, trust cache, arguments and firmware. The owner reports that the treatment did not go black. At target360 there are 253 successful CPU copies and retirements with blank/dark=0/0; the last copy was at 379990 ms. The paired RAM control is still unbooted, so the effect cannot yet be attributed solely to the preferences. v69 removes only the terminal report. The owner confirms Hello remains visible; swipe and power press do not respond.",
  "v67 adds an opt-in root-domain watchdog panic detail with PM machine state, wait reason, current and requested power states, pending count and first pending service class. It also retains a 240-second frame report if no watchdog fires. Kernel prelink and final BOOT FAT checks pass. The device reaches target240 with a completed blank GOP fill 28 ms after the last normal CPU copy. No PM watchdog panic occurred before the report.",
  "v65 with noidle=1 still shows Hello and then turns black after about ten seconds. The owner photo shows no panic text. v66 uses the sleep-disabled ADT default also used on T733 and dada; it retains noidle and adds only that property to the tested payload.",
  "v64 owner photo confirms Sleep/Wake hang detected at IOPMrootDomain.cpp:12812. The linked stack reaches IOService::watchdog_timer_expired; this timer belongs to the PM root domain. The original triggering request and blocked child are unknown. v65 changes only noidle=1 on the continuous v63 image and preserves the power watchdog.",
  "v64 changes the board observation callbacks only in the reviewed display archive, then relinks and repacks the v63 layout with a 240-second runtime report. The new fields track the latest completed CPU copy, explicit blank fill and sampled black source. The source scan is bounded and occurs before copying.",
  "The owner target120 reference shows GOP published, three swaps/copies/retirements, first copy at 114.231 seconds and software vsync start1/arm0. SpringBoard and BackBoard are active, with no desktop observation. The photo has no matching upload receipt. v62 reaches 220 processes with four copies and SpringBoard S1 in a CFRunLoop Mach receive. Publish to first copy remains about 94 seconds. v63 removes the terminal report and reaches visible Hello setup per the owner. Animation stutters and the screen goes black about four seconds later. A short power press did not restore it. v64 adds last copy, blank-fill and dark-source timing in a 240-second diagnostic. The home screen remains unverified.",
  "V37 mode9 limits the report to two processes and one line per sampled thread. It records the current CPU scanout writer thread ID. Host row/line budget and final FAT checks pass. BOOTea3e7c10 owner photo shows both processes and clipped0. Hold0/writer0, two frame retirements. BackBoard samples setGrayscale and SwapEnd. SpringBoard samples the recurring LaunchServices lock and a synchronous Mach wait.",
  "V34 adds an opt-in terminal scanout hold synchronized with the Legacy work loop, and reports display publication and first CPU surface copy times. Host compile, prelink and final FAT checks passed. BOOTc9c49879 uploaded and reboot requested. Owner photo shows hold1 after bounded retries, publication at 18527 ms and first CPU copy at 143217 ms, with five retirements. BackBoard accessibility bundle code executes. Home screen remains unverified.",
  "V32 adds board-side counters for the existing GopFramebuffer software vsync events. BOOT6b692880 rebuilt and passed prelink and final FAT verification against v31, retaining the same arguments and non-kernel inputs. Owner photo shows timer start1/arm0/notify0, open7 and three successful frame retirements. At 60 Hz refresh0 matches the component gate.",
  "BOOTc96f86d7 is a 125-second comparison to BOOTbb4d8474 adding only a synthetic Wi-Fi address. Owner photo shows the same open7/swap2/copy2/retire2 as baseline; SB sample is in the Control Center default module-list property-list path versus a LaunchServices lookup in baseline. Independent live snapshots do not establish relative progress or causality. No confirmed UI improvement; stop repeating address comparisons. See evidence/display/wifi-address-125-v30.",
  "Original 21H461 MobileGestalt static control-flow audit confirms a conditional chosen Wi-Fi property path, sdio/wlan/marconi-wifi fallbacks and an IONetworkController-related fallback. An earlier branch can bypass it. This is not proof of runtime invocation, property acceptance, timeout, or the T970 seeding cause. See evidence/display/mobilegestalt-wifi-audit.",
  "BOOTfec656ec adds only a synthetic local Wi-Fi address property to observed BOOTaeb13ffc. At target90 owner photo still shows open5/swap0, lsd journal-recovery and XPC database-seeding waits, and SB BackBoard screen-info wait matching the baseline caller chains. Single independent samples occur before first frame, and runtime property consumption is unmeasured; no immediate improvement or definitive cause established. See evidence/display/wifi-address-control-v29.",
  "Mode8 BOOTf69965a7 target90 photo captures lsd threads5-7: thread5 handles an XPC request waiting for database seeding, threads6/7 are in workqueue entry; report end marker unclipped. The seeding worker and Wi-Fi lookup were not observed, and thread order can change across boots. See evidence/display/lsd-later-mode8-v28.",
  "Poco F1 iOS16 port reports the same Control Center/LaunchServices/unfair-lock caller chain and traced its stall through lsd seeding and a Wi-Fi address wait. Original 21H461 MobileGestalt contains relevant address and IONetworkController strings; actual T970 v24 ADT lacks both address properties. BOOTaeb13ffc target90 photo shows lsd7 threads, first4 sampled: install journal recovery/dispatch queue, inactive installs/dispatch group, and an XPC call waiting for database seeding. SB still waits for BackBoard screen info, swap0. lsd5-7, seeding owner and cause are unobserved; strings do not prove Wi-Fi lookup. See docs/ui-reference-comparison.md and evidence/display/springboard-mode7-v27.",
  "BOOTe82eec17 target300 owner photo shows main1, CPU8, open7, swap7/0, copy7 and retire7; upload was successful but not read back. SB waits on an unfair lock under the same LaunchServices/Control Center caller chain sampled in the independent target125 boot. BB first thread is in CFRunLoop Mach receive. These two snapshots neither prove continuous refresh nor establish a permanent deadlock. Owner requests shorter future waits. See evidence/display/display-late-v26.",
  "Host prepared BOOTb6e55159 from observed BOOTbb4d8474, removing only the terminal 125-second runtime report argument. FAT roundtrip passes. After two failed pre-upload attempts the authorized BOOT upload succeeded without readback. Owner observed unchanged Apple logo for over three minutes following reboot, without other screen or reboot; background progress, frame updates and desktop remain unverified. check-platform stops before DT/ADT because the sibling framework HEAD differs from the reviewed pin. See evidence/display/display-continuous-v25.",
  "BOOTbb4d8474 owner observed Apple logo; photo14:40:13 shows swap2/0, transfer2, copies2, retire2. BOOT08b90255 previously panicked on uninitialized vc_progress_lock via first swap console handoff. Guard now matches t970-novc bootstrap. SpringBoard sample reaches LaunchServices database context from Control Center module discovery; sustained desktop pending. See evidence/display/display-novc-v24.",
  "BOOTe44011cb photo03:08:38 links BB wait to QuartzCore CAMetalContextCreate polling IOAcceleratorES, at most 300 sleeps of 100ms; SB waits for main screen info, open6/swap0. T733 48f documents CPU frames through NativeLegacyDisplay. BOOT08b90255 keeps kernel and changes report target to 125s; FAT comparison passes, ADT differs only in random-seed. See evidence/display/ui-cpu-fallback-v23.",
  "BOOT5385b6ce owner photo03:00:42 shows three pending queues drained, MG done134, BB161, SB75->78, display open6/fail0/swap0. No constrained head means Q cap zero is absent data, not a measured cached limit. v22 reuses exact v21 kernel with existing stack mode1 to locate current BB/SB main waits; host image checks pass, hardware stack result pending.",
  "v21 BCM2837 EDGE width fallback uses registered SMP CPU/cluster counts only when E/P counts are both zero. Previous BOOT705d4160 has all eight ADT CPU cluster-type absent (SMP), cached constrained cap0 and callback progress. Actual prepared-function ASan/UBSan tests cover SMP1/8, E/P precedence and non-BCM guard; kernel/prelink/FAT checks pass. BOOT5385b6ce hardware result pending; this is not validated heterogeneous scheduling or desktop. See evidence/display/edge-smp-v21.",
  "BOOT705d4160 mode6 owner photo02:38:12 captures all three processes/end marker unclipped. Constrained cap/active/busy=0/0/0; MG done35->37 while BB25/SB53 unchanged across 500ms deadlines. Runtime callback continues; investigate EDGE E/P counts versus current SMP topology before any scheduling change. See evidence/display/ui-queue-progress-v20/device-result.json.",
  "BOOT6ef0db8c photo01:42:52 shows MG/BB/SB req4/6/4 idle2/1/2 creator0 and open2/swap0; flags14=death+delayed scheduled,10=delayed. Single snapshots do not prove lost wakeups; SB tail remains offscreen. v20 mode6 takes two read-only queue/admission snapshots per process 500ms deadlines apart, converts absolute time with kernel API, and performs no user VM reads or scheduling mutations. Host helper/kernel/pack checks pass; device result pending, see evidence/display/ui-queue-progress-v20.",
  "BOOT10dbedd8 photo01:27:03 batch captures MG/BB/SB headers: MG wq7/0/6 and no limit flags, BB2/0/1, SB2/0/0; display open2/swap0. SB tail/end marker offscreen, clipping status unverified. Shared semaphore wait-event value does not prove same semaphore. v19 adds read-only workqueue req/flags/idle/creator/last-call timing snapshot and compact batch output; host helper/ABI checks pass, hardware pending.",
  "BOOT6da8d322 photo01:17:48 target90/main1/n109 shows MG threads5-7 same16-frame chain, ending at MG global lock call; thread8 start_wqthread, display open2/swap0. Owner/callback execution unresolved. User requested batch capture: mode5 samples BB/SB/MG first8 threads each with16 frames, wait events/priorities/tids and try-lock workqueue info, deduplicates identical sampled stacks. Host helper/ABI checks pass; hardware pending. See gestalt-workers-v17 and ui-batch-v18.",
  "2026-11-04 original MG review identifies global-queue semaphore helper using MobileGestaltRunLoopMode, with syscfg fallback matching AppleDiagnosticDataAccessReadOnly. Original kext requires Apple NOR/NAND config provider absent on this board, but timeout semantics mean absence alone is not proof of permanent stall. Mode4 samples helper threads5-8 previously outside visited4. Host tests/ABI compile pass; hardware pending. See gestalt-workers-v17.",
  "BOOT91025540 photo01:09:00 target90/main1/n107 confirms MobileGestaltHelper95 threads8/visited4/busy0, FP9/16 frames error0. Helper handles NSXPC request through _MGServerCopyAnswerWithError then waits in semaphore inside MobileGestalt; precise internal provider unresolved. Display open2/swap0.90 seconds sufficient for this target snapshot. See gestalt-stack-v16/device-result/symbols.",
  "BOOT93bd51e8 photo01:03:24 BB thread2 sixteen frames/error0 reaches RemoteHID AACP activate -> BTSessionAttachWithQueue -> MGGetBoolAnswer -> MobileGestaltExtensions synchronous XPC. Original BT call queries bluetooth; original com.apple.mobilegestalt.xpc job runs MobileGestaltHelper. Mode3 samples helper first2 threads,16 frames; next target90 per owner timing request. Host mode3 tests/ABI compile pass; hardware pending. See ui-stack-deep-v15 and gestalt-stack-v16.",
  "2026-11-04 ui-stack-deep-v15 expands only mode2 selected BB FP chains to16 frames to find caller above NSXPC synchronous send; mode1 remains8. Actual ASan/UBSan16-frame cap test and Mach-private compile pass. Hardware pending; evidence/display/ui-stack-deep-v15.",
  "BOOTdbb7921a photo00:58:17 confirms BB thread2 eight frames/error0 in synchronous NSXPC reply wait through _sendSelector:withProxy:arg1:arg2:, thread3 one frame/error0 at start_wqthread; open2/swap0. Slide0xe784000 cross-checked against original mach_msg2 PC; XPC caller/peer remains unresolved. See ui-stack-other-v14/device-result.json.",
  "2026-11-04 ui-stack-other-v14 adds diagnostic mode2 for BB queued threads2-4, each bounded to8 frames, preserving mode1 and no-stack default. Host ASan/UBSan selection/reference checks and Mach-private compile pass. Hardware pending; see evidence/display/ui-stack-other-v14.",
  "BOOTa708fadf owner photo00:46:53 confirms main1/n147/cpu8/sec7, BB57/SB27 each8 FP frames/error0, display open2/swap0. UUID-matched symbols place BB in IOHIDSessionOpen semaphore wait after dispatch_async initialization submission and SB in BKSDisplayGetMainScreenInfo Mach message. Does not identify a missing touch driver. See ui-stack-v13 device-result/symbols; next sample BB other threads.",
  "2026-11-04 ui-stack-v13: opt-in isolated worker reads at most8 FP frames for each UI process first queued thread after releasing locks; reporter uses20 scheduler deadlines and hides partial buffers. Actual ASan/UBSan helper and current Mach-private compile pass. Live stacks are not coherent snapshots; VM worker is not cancelled on timeout. New image hardware results pending; see evidence/display/ui-stack-v13.",
  "BOOTd80a3773 target120 owner photo confirms main1/n148/cpu8/sec7, BB57/SB27, display opens2 but no swap/frame, KeyStore opens49/calls194. Saved PC/LR of3 threads per target and slide10914000 captured with busy0. Original cache/symbol UUIDs match; BB queue-first PC maps semaphore_wait_trap+8 and LR libdispatch semaphore-wait variant+24; other rows map mach_msg2/workq. Current sampler has no scheduler-state or user stack, so an upstream dependency is not yet established. Next capture bounded caller frames in a separate worker.",
  "UI runtime follow-up: BOOTdb0121c9 target120 confirms BB57 and display client2/open2/fail0, all swap/frame counters0. Catalog AppleKeyStoreState42ff83e is now linked behind explicit RAM-only gates: BOOTb9cc7afb target60 confirms stage4/ready1/open1/call1/selector0 success, no frame. BOOTf6fd6636 confirms768MiB request manages pages0x2b187, no earlier display by60. Continuous BOOTec912b09 owner observation remains color bars only. See ui-call-v9, key-state-v10 and memory768-v11.",
  "V9 owner photo target60 confirms main1/n69/cpu8/sec7, SB27 spawn return1/e0, BB0/e-1, path-copy-errors0, both job-lookups0/e-1, display stage8/mapped1/published1 and all client/frame counters0. Associated with latest prepared/uploaded BOOT45531047 by sequence and unique v9 field, without screen image ID or device hash readback. Host original plist/cache contains automatic backboardd job; runtime import not proven. Fixed T733/umi/sheng code review identifies missing KeyStore state registration and much smaller managed RAM as concrete audit targets, not established causes. Same-kernel target120 BOOTdb0121c9 packed/round-trip verified, not uploaded. ASan/UBSan helper tests pass after updating report API stand-ins; platform checker refuses stale reviewed framework revision.",
  "UI-job-v8 kernel049897a9/BOOT1939b59d adds PID1 namei basename lookup counts and latest matching open error for BB/SB plists using existing kernel path copies only. Actual helper ASan tests cover filters/relative paths/errors/ring/bounds. Job lookup is not parsed/imported job proof; path/return association is best effort. Same eight-core60-second display diagnostics and policy. Hardware outcome pending; see evidence/display/ui-job-v8.",
  "Client-v4 confirms zero display clients/swaps. Native UI nonzero-exit trap v5 did not trigger. V6 saved-path sampling was too late (exec_activate_image already frees strings), so its zero target counts are invalid absence evidence. Corrected v7 BOOT535c53e9 observes SB1/27/0/activated1, BB0, total89 activations at60; positive SB control validates path capture. Does not rule out pre-activation failure, alternate path or later BB launch. Actual helper ASan checks and pre-free placement check pass. Next inspect launchd job import/early spawn.",
  "Client-v4 adds relaxed diagnostic counters for client enter/open/fail, swap accept/reject, transfer/status, copies, retirement and vsync notifications. Actual formatter/counter block passes ASan bounds/null/state checks. Kernelb81e0783 builds/prelinks; independent payload/BOOT/eight-core preparation passes. No rendering decisions changed; counters are best-effort snapshots. Hardware client/frame outcome pending; see client-v4.",
  "BOOT0854aff6 owner photo18:12:19 confirms display stage8/meta0/surface0/mapped1/published1, main1/n69/cpu8/sec7. Actual display class/init, IOSurface readiness, GOP mapping, original start and publication succeeded. Client opens, swaps, CPU copies and rendered desktop remain unverified; backboardd not observed in snapshot. See status-v3/device-result.json. Umi uses the same real IOBSD/IOSurface lifecycle boundary; do not copy its board geometry.",
  "Owner requested full continuous boot: same-kernel BOOTc39efc0f prepared with8 CPUs, runtime sampler absent, CPU transfer/validation/retirement and software vsync60 enabled. Independent packing checks pass; rendering and physical refresh unverified. Abstract backend guards remain. See evidence/display/continuous-v1 upload and pending hardware observation.",
  "BOOT5e318d75 target60 owner photo17:09:08 confirms main1/n69/cpu8/sec7, SpringBoard27/runningboardd26 and IOMFB_bics_daemon86; backboardd not observed. No dedicated display counters yet, so publication/mapping/presentation not qualified. BOOT-only upload exit0; next add direct stage/status sampling.",
  "Display late archive linked after removing duplicated board-owned early frame counters. Kernel0adf72f3 prelink and independent BOOT5e318d75 packing checks pass; isolated work .config enables Legacy only, defaults unchanged. Eight-core target60 explicit GOP/PM integration probe; CPU presentation off. Runtime report lacks dedicated publication counters, so main1 alone will not verify display. Hardware observation pending; see evidence/display/integration-v2.",
  "T970 display registration/mapping/observation callbacks implemented behind explicit t970-display-start=1. Current XNU compile and actual GOP board callback-symbol checks pass; nine native_legacy original-family aliases plus original class/kernel bindings still require final linking. Geometry helper passes17 rejected and2 accepted assertions. No archive/BOOT or device publication/rendering result; failure cleanup not API-injection tested. See evidence/display/registration-v1.",
  "GopFramebuffer cf3b429 NativeLegacyDisplay compiled with current T970 XNU recipe and Wall/Wextra/Werror. Actual Mach-O relocation audit confirms358 virtual entries and24 expected owned methods/abstract leaves. Original/candidate ABI audit checks native-symbol rebound slots, nine abstract leaves, seven IOSurface getters and unchanged graphics text. Object only: registration callbacks, linked archive, runtime mapping/publication/presentation remain pending. See evidence/display/abi21h461.",
  "BOOT3da265b4 target60 owner photo confirms main1/n67/cpu8/sec7, SpringBoard27/runningboardd26, Data0/policy0/stage4 and all-core positive timer/SGI snapshots. Backboardd not observed; free0x183 excludes reclaimable memory, not sole OOM proof. Sustained runtime, controlled CPU workload and desktop remain unverified. See runtime-cache60/device-result.json.",
  "BOOTeeeba83b owner photo19:36:40 shows requested120-second runtime report: genuine main1,109 processes, watchdogd absent, SpringBoard27/backboardd56/runningboardd26, Data0/policy0/stage4,964876 verified blocks. Kernel deadline-wait/report executed; rate accuracy unmeasured. Interface-service process presence is not proof of rendering or functional services. Display backend remains disabled; next phase is display handoff/provider and independent staged SMP qualification.",
  "BOOT 933a5d77 device screen is confirmed through END slots=87. Corrected SM8250 GCC gate passes; HCE=1 HCS=10f IS=400, both queue run-stop bits set and both doorbells zero, UTRLBA=9b296000. The sole valid SMR 84020820/S2CR 4 exactly matches the captured display SID 0820 mask 0402; preserve slot 04 and CB4. Candidate residues in invalid slots 02/03 are not active routes. No DMA, SCSI or root read was attempted.",
  "Uploaded deliberate after-MMU BRK control 150ed5ff9d73d81b17d3f6d32e609b9a9e42fdfe0397da7c5eea7d62f7ce7b4d, using patched Heimdall, exit 0. The device reset at about 50 seconds, matching the reviewed BRK path; original BOOT restoration is still pending. C startup and console behavior are not exercised.",
  "After-MMU BRK control image prepared and extracted from FAT: BRK word, unchanged PE_create_console call, guard bytes, vector branches and preserved IRQ/FIQ slots verified. Eight host tests passed; hardware BRK delivery and the ~50-second timed reset were observed.",
  "Added explicit after-MMU BRK control mode to qualify diagnostic execution before C startup. It preserves PE_create_console call bytes, uses the same reviewed fault handlers, and expects the distinct 50-second BRK path. Device execution and fault routing remain unverified until observed.",
  "Guarded image e18c6ca0e905e0e40a2283447a765bdc322bbcc85bf0cb19fe80ec857007be29 did not reset within 60 seconds. Neither PE_create_console return nor a fault terminal is established. Next is a deliberate after-MMU BRK control to qualify the diagnostic path independently of C startup; no spin-loop diagnosis is claimed.",
  "Uploaded guarded PE_create_console return probe e18c6ca0e905e0e40a2283447a765bdc322bbcc85bf0cb19fe80ec857007be29, using patched Heimdall, exit 0. Measured outcome and original BOOT restoration remain pending. Fault outcomes classify early paths and do not by themselves identify the failing function.",
  "Host checks for guarded PE_create_console return passed: eight tests, verified 112-byte guard code and all modified vector/panic branches inside the actual FAT kernel, with IRQ/FIQ/reserved slots unchanged. Runtime outcome and device BRK control remain unverified.",
  "Added an opt-in early-fault diagnostic restricted to PE_create_console return in arm_init on repaired kernel bfb50a1a. It verifies the compiled active-vector selection, preserves IRQ/FIQ/reserved slots, and terminates sync/SError/panic/BRK paths at 20/30/40/50 seconds. This is not a normal kernel, text/register log or device fault result.",
  "Repaired PE_init_printf(TRUE) return checkpoint was not observed (f759eb8085bb67c4a1d2ac02ea18898e6d146118fc790148638f33cfc81cd9a7). User photo shows retained firmware/loader text and entry bars, not a confirmed XNU text log. Restored PE_create_console may stop earlier; old-kernel gc_enable localization cannot be assumed for this new kernel.",
  "Uploaded repaired-console PE_init_printf(TRUE) after-return probe, image f759eb8085bb67c4a1d2ac02ea18898e6d146118fc790148638f33cfc81cd9a7, using patched Heimdall, exit 0. Device return result, text rendering and original BOOT restoration are pending; transfer alone does not verify the repair.",
  "Repaired kernel bfb50a1a009f4dd08d54cb94d6187d768c7a5ef976427abd235756874f38473c compiled, linked and prelinked successfully. Mach-O checks verify PE_init_printf(FALSE) immediately precedes unconditional PE_create_console. Build configuration checks passed for 61 patches and 19 pinned modules; device return probe is pending.",
  "Human timing of about four seconds for console-state image 670e78ee17a752fc297dc6537a0c98d0074d8d191c599aa065804bd9ae6cb341 supports gc_initialized low bit 0 and PE_putc NULL before gc_enable. This supports missing console initialization under the experimental skip patch, but does not identify the exact faulting instruction.",
  "Replaced the experimental skip-console patch with t970-console-bootstrap.patch: arm_init now always installs PE_init_printf(FALSE) before PE_create_console, restoring callback and console/lock setup rather than continuing with uninitialized console state. Kernel rebuild and prelink passed; the final Mach-O has adjacent unconditional PE_init_printf(FALSE) and PE_create_console calls. Device return checkpoint remains pending.",
  "The handed-off t970-skip-early-console.patch keeps PE_create_console/PE_init_printf opt-in via t970-console as an experimental workaround. It does not prove an Apple-console hang; the latest user result places the unobserved checkpoint before initialize_screen.",
  "The live DT contains many alternative panels; the boot selector identifies S6TUUM3 rather than the S6TUUM2 candidate.",
  "DRM mode geometry is landscape while wm and touch coordinates are portrait; display/input orientation must be mapped explicitly.",
  "At capture time DPMS was Off and brightness was zero; this records Android runtime state, not a display failure.",
  "GopFramebuffer is deferred at Step 2 because the T970 UEFI GOP handoff and display power callbacks have not been established.",
  "The bring-up console patch populates vinfo and maps the UEFI framebuffer only so the panic screen can draw text; no display driver, panel init or XNU framebuffer integration is implemented and display remains planned.",
]
