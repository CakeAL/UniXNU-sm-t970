# SM-T970 hardware inputs and platform bootstrap implementation.
# Host checks and Android input observations are separate from XNU device verification.
schema_version = 1

[device]
name = "sm-t970"
soc = "SM8250"
os_profile = "ipados-17.7.11-21H461"
summary = "Samsung Galaxy Tab S7+ Wi-Fi (SM-T970, gts7xlwifi, SM8250). Android hardware inventory and a single-core platform bootstrap configuration targeting iPadOS 17.7.11 (21H461); no XNU build or UEFI/device boot is verified."

[[area]]
id = "configuration"
status = "host-verified"
components = [
  "ArmDTPlatform",
]
paths = [
  "porting.toml",
  ".gitignore",
  "log.txt",
  "evidence/adb-2026-11-01/identity.txt",
  "board.toml",
  "feeds.toml",
  "configs/**",
  "local.toml.example",
  "unixnu.lock",
  ".github/**",
  "README.md",
  "AGENTS.md",
  "evidence/platform-bootstrap/status.json",
  "evidence/platform-bootstrap/source-snapshots.json",
]
inputs = [
  "ADB reports SM-T970, gts7xlwifi, SM8250, board platform kona and hardware qcom.",
  "The target OS is iPadOS 17.7.11, build 21H461, matching the local IPSW BuildManifest.plist.",
  "SoC feed: FFT-infra/UniXNU-sm8250-common at 166235ec2480ff0992627b7aafa15c65ce6b4efa; reviewed with UniXNU 04b4e558bcded5213c2d802984862dc062f28257.",
]
configuration = [
  "board.toml uses schema_version=2, name/kit=sm-t970, soc=SM8250, soc_source=sm8250 and os_profile=ipados-17.7.11-21H461.",
  "Complete component selection: ArmDTPlatform, ArmCpu, SoftwareAES, XnuPrelink and DarwinBoot. The inherited archive list is preserved.",
  "Config fragments are ARM64 common, SM8250 and iPadOS in that order, followed by sm-t970_defconfig. Patch series are arch, soc, os, device; arrays replace inherited arrays.",
]
procedure = [
  "From the sibling UniXNU checkout run python3.14 ./unixnu defconfig sm-t970_defconfig -D ../UniXNU-sm-t970, fetch the six selected SoC/component sources, then run status --json and tree.",
  "Run python3.14 ../UniXNU-sm-t970/scripts/check-platform.py --unixnu . to compare DT/ADT bindings with the captured hardware.",
]
findings = [
  "The official examples/device structure is present, retaining the existing hardware inventory and scripts. Board-specific names replace the template identity.",
  "The resolved bootstrap contains five canonical components, three configuration fragments and 61 ordered patches, including both SM8250 CPU patches.",
  "Kernel archive recipes remain inherited from ARM64. Component choice is configuration work, not evidence that any XNU driver has executed.",
  "Host check passed against committed platform inputs at 5cab8f372a491af149ce27df02d918f6ac8cddba; configuration resolution, five component pins and all 61 patch paths are recorded in evidence/platform-bootstrap.",
]
completion = [
  "A board.toml with matching device identity resolves the selected SoC and OS profiles and pinned sources.",
]
limits = [
  "board.example=true remains because UEFI config/DSC/FD paths and the allocatable RAM handoff are unverified. Build and bootimg refuse this staging configuration.",
  "Apple reference sources and kernelcache/ABI/seed inputs are not fully prepared; no kernel, package, firmware or boot image is built.",
]
next_action = [
  "Establish a T970-specific UEFI launch/recovery path and its allocatable memory map before changing board.example or attempting a kernel/image build.",
]
evidence = [
  { kind = "source", reference = "log.txt", result = "Archived stock-Android shell output identifies SM-T970, gts7xlwifi and SM8250; it is hardware inventory, not UniXNU verification." },
  { kind = "device", reference = "evidence/adb-2026-11-01/identity.txt", command = "/opt/homebrew/bin/python3.14 scripts/collect-adb-inventory.py --root --output evidence/adb-2026-11-01-complete", result = "Saved Android properties, kernel identity and existing Magisk root context; no XNU verification is claimed.", revision = "54fafba28ae100130a1d21bf0936983ab632c782" },
