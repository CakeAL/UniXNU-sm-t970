[[area]]
id = "power"
status = "implemented"
components = []
paths = ["evidence/power/battery-clock-v93/**", "evidence/power/battery-gauge-v94/**", "evidence/power/battery-service-v95/**", "evidence/power/battery-config-v96/**", "evidence/power/charge-restart-v97/**", "evidence/power/charge-fix-v98/**", "tests/test_battery_clock_probe.py", "tests/test_gauge_probe.py", "tests/test_gpio_i2c.py",
