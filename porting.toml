[[area]]
id = "input"
status = "implemented"
components = []
paths = [
  "package/T970Input/**",
  "scripts/build-key-probe.py",
  "tests/test_key_probe.py",
  "evidence/input/keys-v89/**",
  "evidence/input/keys-v90/**",
