  { kind = "host", reference = "evidence/power/battery-gauge-v94/preparation.json", revision = "b700a694021722740e7212cfe4e28c24adce0f31", command = "build-kernel.py --cached-headers --setup-probe --gop-fork --keys --refresh-hid; battery-gauge-v94/prepare.py", result = "BOOT6d5c4c60 compiled/linked/prelinked with preserved source snapshot hashes; exact v93 ADT,seed,trust,firmware,DTB/header/tail retained. Upload receipt and device photo are separate; the gauge measurement is confirmed, OS publication is not." },
  { kind = "device", reference = "evidence/power/battery-gauge-v94/device-result.json", revision = "91f89daf71ea03578698fbe94649182138cb6e3d", command = "BOOT6d5c4c60; owner three-finger photo2026-11-07T13:07:58+08:00", result = "Desktop reached (SpringBoard27, backboardd57). Gauge id15/02 valid7f; soc1006049, uV3925312, uA0, mC28199, cap5442/8787. Charger INT_OK0xcf, DETAILS_000xe0 (CHGIN valid), DETAILS_010x3b (watchdog expired), so external power present and charging inactive. GPIO restore1, no PMIC/gauge/charger writes." },
  { kind = "host", reference = "evidence/power/battery-service-v95/host-validation.json", revision = "766fe6786931e948b060f325b8a2b62befcfe86f", command = "python3.14 -m unittest discover -s tests; battery-service-v95/prepare.py", result = "68 tests ran, 10 skipped, OK (4 battery-service tests). BOOT01e85687 carries the battery object in libShengPlatformPower.a, the kernel defines _t970_battery_start/_t970_battery_report/__ZTV11T970Battery, bsd_init references the start call, and the 971-byte argument list keeps t970-battery=1 beside t970-battery-ro=3." },
