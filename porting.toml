findings = [
  "The matched v68 display comparison runs disposable RAM Data from copies of the existing 512 MiB seed. Both retain the Data UUID and disable the persistent backend to avoid reinitializing the existing UFS store. A direct v67 comparison therefore mixes Data history and policy.",
  "The v62 owner report shows Data mounted with 15402 free 4 KiB blocks (about 60.2 MiB) and 1115551 verified UFS blocks. There is no ENOSPC measurement. Data contents change across boots.",
  "The verified 512 MiB APFS seed reports 534294528 free bytes when attached read-only on the host, before any device writes. This is not runtime free space. BOOTe0a2d858 adds an opt-in bounded worker that checks the actual RAM Data device and requests APFS block counts, while preserving display counters in the 125-second terminal report. Host helper, BSD compile, kernel/prelink and packing checks pass; owner photo after successful BOOT upload shows rc0/phase1/support1d0 and 78135 available blocks of 4096 bytes (320040960 bytes). At the target125 snapshot the mounted RAM Data APFS has free capacity. See evidence/storage/data-space-v31.",
  "BOOT705d4160 mode6 owner photo02:38:12 captures all three processes/end marker unclipped. Constrained cap/active/busy=0/0/0; MG done35->37 while BB25/SB53 unchanged across 500ms deadlines. Runtime callback continues; investigate EDGE E/P counts versus current SMP topology before any scheduling change. See evidence/display/ui-queue-progress-v20/device-result.json.",
  "First boot of7e60f7c9 refused UFS handoff NOP at stage0, before NOP submission; CB0=100ff/1/e0, GFSR0 and historical FSR400. Owner rebooted the same image and root reads recovered. Exact stage0 predicate remains unknown; no storage gate or mappings were relaxed. Both photos are retained in evidence/cpu/smp-bringup/ipi-check/device-result.json.",
  "BOOTeeeba83b owner photo19:36:40 shows requested120-second runtime report: genuine main1,109 processes, watchdogd absent, SpringBoard27/backboardd56/runningboardd26, Data0/policy0/stage4,964876 verified blocks. Kernel deadline-wait/report executed; rate accuracy unmeasured. Interface-service process presence is not proof of rendering or functional services. Display backend remains disabled; next phase is display handoff/provider and independent staged SMP qualification.",
  "BOOTeeeba83b uses explicit t970-runtime-report=120 to start one diagnostic kernel thread after Data/policy install. Deadline wait yields CPU; bounded512 non-zombie callbacks, first18 names in512bytes and named service PIDs are displayed in intentional panic. Readonly genuine-main accessor and original process refs/exit policies retained. Actual helper sanitizer/API-substitute bounds/wait/range/once/thread-failure tests plus policy regression and independent symbol/FAT/ADT/boot/argument verification pass; implicit sampler configuration refused. BOOT-only upload exit0; physical timer/snapshot and later services pending.",
  "BOOT28268af5 owner photo19:10 confirms genuine main1/error0/Data0/policy0/stage4. Kernel installer actually completed root-owned RAM policy and migration marker writes/metadata/fsync/close before launchd main. Probe is readonly, preserves original sysctl semantics and caller frame;27 Unicorn state/result combinations plus unknown-input refusal pass, actual pinned binary/FAT/geometry checks pass. Normal BOOT2387e904 restored via BOOT-only upload exit0 after observation. Original launchd override acceptance, subsequent services and desktop remain unverified.",
  "BOOT2387e904 installs an explicit temporary original-launchd watchdog-only override after successful volatile Data mount when t970-disable-watchdogd=1. Refuse non-RAM/persistent/readonly/unready/nonroot conditions and existing policy/marker; exclusive nofollow creation, root metadata and full write/fsync/close before migration marker. Actual helper ASan/UBSan15 API failure points plus guard/preservation/cleanup cases pass; original launchd/watchdogd unchanged. Source39d7cfe1/real PMGR and independent FAT/ADT/boot/argument checks pass. BOOT-only upload exit0, runtime policy acceptance/services pending.",
  "BOOT97271e99 photo18:22 confirms launchd main1/err0 and managed pages0x1b709 (~439MiB):512MiB EFI-owned request works. BOOT911a462a new Data build failed AMFI No PMGR because isolated output silently used FirstPassStub. Remove implicit stub, require a reference, audit real PMGR340 slots and reject missing registration symbols/archive members in independent pack checks. Repaired6b83f4e6 uploaded exit0; photo18:42 shows watchdogd PID102 SIGTRAP. Enforced exact-device/writable/APFS mount success gate precedes exec, so Data mount success is inferred, not a Data write/persistence test. Original watchdogd host branch and launchd root-owned watchdog-only policy checks pass with explicit OS API substitutions; policy not applied.",
  "2026-11-02: normal release BOOT867efc59 requests512MiB via the chosen ADT property only; fixed normal kernel/FD/DTB/config/tail preserved, Heimdall upload exit0. Owner reports retained bars, which does not localize execution or verify allocation. Terminal main checkpoint BOOT97271e99 uploaded exit0 to measure actual pages; runtime result pending; Data APFS32MiB seed packed losslessly to1007696bytes on host, not integrated/flashed or persistence-qualified. Physical8GiB is not the EFI-owned256MiB diagnostic allocation.",
  "After corrected carriers were backed up/updated and fully readback-verified under explicit authorization, BOOT097c4f8c owner photo shows memorystatus no-victim (available3060pages), rather than prior cache EACCES. This is not proof of full mapping/launchd main. Source retains73293824bytes of carrier plus another73293824bytes of duplicated manifest tables. Borrow only exact authenticated driver-owned boot-lifetime allocations, protect them readonly, retain separate private readonly key pages and reauthenticate; fallback sources still copy. Teardown never frees borrowed carrier. Actual configure/free host ASan/UBSan+mprotect lifecycle/failure tests pass; Normal BOOT12766f5f stalls with persistent bars over3minutes. Isolated BOOTef97eb6a resets about10seconds after magenta per owner, confirming at least one shared-policy vr_open return but not success status. BOOTc544bae1 before-init-exec checkpoint immediately resets per owner, confirming the exec call boundary only; exec and launchd success remain unverified. Session stopped at owner request. EFI owned window remains256MiB.",
  "Root cause identified on host: deployed/readback raw root fd43ee70 contains original OS e5634d04/SystemOS b4908cde, but current owner envelopes signed stale sparse windows47c1e4b0/ee18c5c2. Prior userdata-write-audit already recorded the stale segment seek bug. SystemOS block43008 in stale segment/policy is SHNGROOT, whereas raw/original data match; host APFS mapping for .03 read offset34MiB covers this block. Signer read SHA at wrong entry offset80 instead of56 and never compared it. Fix both, validate full window digests before signing, and prepare envelopes from exact raw source. Five generator and five writer-order/error tests pass; real C verifier authenticates all2290185blocks. Corrected carrier write plan is prepared but not executed; do not infer new device success. Diagnostic BOOT097c4f8c remains host-prepared/unflashed.",
  "BOOT 6b04878c owner photo: stage171, .03 read offset0x2200000, expected original CDHash. AMFI and earlier signature setup passed; actual native4k vn_rdwr returns EACCES. Add read-mediation201 versus filesystem202 observations and first actual UFS integrity-rejected block index/LUN0-LBA/length/hash prefixes. No additional I/O or retry/grant; original rejection is preserved. Nine existing state tests and actual-helper ASan/UBSan bounds/retention checks pass. New build/runtime observations pending; storage corruption is not yet established.",
  "Owner photo for BOOT dd007d58 shows .02 openat and F_ADDFILESIGS_RETURN97 succeed, then .03 openat returns fd4 and fcntl97 returns EACCES13. Host original cache/.01-.04 CodeDirectory pages all verify and CDHashes are present in the unchanged original System trust module; .03 cdhash is 55b4a307efbf08234c98c81f09f1d17e5efc0d0a. This does not establish device-runtime integrity or identify the rejecting stage. Add first-PID1-EACCES pipeline-stage/offset/known-kernel-CDHash observations without changing signature/trust behavior; host helper filtering/latching/encoding cases pass, runtime stage pending.",
  "After BOOT 49f3b166 actual dyld cache failure, add PID1-only bounded numeric results for open/openat, fcntl and shared-region calls plus the existing kernel-owned copied namei path. No extra user-memory reads, argument/result changes or policy bypass. Keep 24 entries and show the last 12 only at initproc fatal exit. Actual-helper host checks cover PID/null filtering, scalar errno/command, path truncation, wraparound and output bounds. Kernel 170cc979 and BOOT dd007d58 build with stable inputs and pass FAT/FD/geometry checks; BOOT-only upload at 22:47 exits 0 and requests reboot. A last-copied path is not a per-thread causal trace; actual startup trace is pending.",
  "BOOT dc42838f owner photo: mount=2 stage=3 auth=0 mstatus=2 and all three cache lookups ENOENT. Read-only original OS inspection shows System/Cryptexes/OS is a symlink to ../../private/preboot/Cryptexes/OS, whose target is absent; private/preboot is empty. T733 3bb0d6f and SM8250 umi 3eb7257 both use the authenticated readonly SystemOS root union for initial cache startup. Restore that configuration and check its actual /System cache path. Also import the T733 shared kernproc-cwd/rootvnode reference correction: extracted actual XNU checkdirs fails the ownership test before the correction and passes five cases after it. This independent reference bug is not inferred from the mount ENOENT photo; Kernel 1d83105e/BOOT 49f3b166 passed actual compiler-branch checks and five reference cases, then BOOT-only upload exited 0 at 22:35. Owner photo confirms preparation/cache vnode guard passed and actual dyld still exits namespace 6/code 1 (no dyld cache), carrier acc/rej 0/0. Union same-mount behavior means these counters do not identify the failed stage. Next observe real syscall returns without extra user-pointer reads.",
  "dsh handoff photo attributed by the owner to BOOT a41b5c11/kernel d66b832b shows mount=0 stage=6 auth=1 mstatus=0 sys=0 cryptex=2 preboot=2. Preserved host kernel matches d66b832b, but resolved .config and actual kern_exec compile record still enable OWNER_UNION_SYSTEMOS=1; defconfig edits were not regenerated. The unconditional three-path panic also stops before launchd. Explicitly disable union, regenerate config and panic only for mount or cryptex-lookup failure; BOOT dc42838f/kernel 8262854b builds with stable tracked inputs; real compiler preprocessing confirms union=0 and consistent mount/environment/carrier paths. Independent FAT/FD/geometry and DT/ADT checks pass; check-platform.py fails its historical five-component assertion. The owner explicitly authorized flashing; Heimdall uploaded BOOT dc42838f and requested reboot at 22:23 Asia/Shanghai with exit 0. Startup/cache mapping/launchd observations remain pending.",
  "BOOT cfbd84ba photo confirms stage4: ID/VALID/S2CR accepted, direct FAULT restore200ff succeeded without fallback, allRestored/mappingsUnchanged=1 and GFSR=0. Six context states captured; CB0..4 already configured with FSR400 of unknown age, CB73 SCTLR3ab3a706 is not a verified free bank. No context writes, DMA or UFS commands occurred.",
  "Combined field diagnostic BOOT cfbd84ba34fc03b50661b46c9e22fe59c43ba651bca6967da49f1df1ec373e75 prepared from source7ee2918/kernel53e9e68c. Thirteen host tests, input-stable kernel build, independent FAT/arguments/FD checks and DT/ADT check passed. BOOT-only upload exited0; actual VALID/S2CR/restoration/context observations remain pending.",
  "Prepared a combined single-slot field qualification after ee45890a: test VALID only under unchanged FAULT policy; test S2CR only with SMR invalid; restore with a bounded Qualcomm-aware fallback if necessary; compare all protected mappings; only then read six context states. No UFS commands, DMA route grants, queue/context/global/clock/SCM writes. Field results and restore flags still require exact-image device observation.",
  "BOOT ee45890a device photo confirms stage5, inactive SMR56 ID a5 accepted and restored to zero; S2CR remains200ff, restoreOK and mappingsUnchanged are1, GFSR before/after zero and display04 unchanged. This qualifies only inactive ID-field writes, not VALID/S2CR/context/DMA, and contradicts blanket read-only claims for this measured field.",
  "Single-slot SMR ID test BOOT ee45890ab4875987b0e3376b095a64a5d58f1b23177c96b9ea4a996cd8ba9031 prepared from source 41d99e6 and kernel d455be28. Twelve host tests pass; compiled code has exactly two writes to offset958 with DSB after each. Packed FAT/arguments/FD, capacity and DT/ADT checks pass. BOOT-only patched Heimdall upload exited 0; device field acceptance/restoration observation is pending.",
  "Prepared a single-slot inactive SMR ID-field test, based on the complete 933a5d77 handoff observation. Requires exact measured geometry, clean GFSR, controller prerequisites, sole display mapping unchanged and slot 56 equal to zero/200ff. Rechecks mappings, writes only invalid ID a5 at offset958, restores zero and compares protected state; both writes fenced. No VALID/S2CR/CB/GCC/HCI/SCM/DMA changes. Outcome is not yet observed.",
  "BOOT 933a5d77 device screen is confirmed through END slots=87. Corrected SM8250 GCC gate passes; HCE=1 HCS=10f IS=400, both queue run-stop bits set and both doorbells zero, UTRLBA=9b296000. The sole valid SMR 84020820/S2CR 4 exactly matches the captured display SID 0820 mask 0402; preserve slot 04 and CB4. Candidate residues in invalid slots 02/03 are not active routes. No DMA, SCSI or root read was attempted.",
  "Prepared and independently verified BOOT 933a5d776edb2500be5c268b93e64f2cfec53fee6e12cebbb39869a8d7050deb from source 58bdac8 and kernel 147f8d3b; DT/ADT checks passed. Patched Heimdall uploaded BOOT only with exit 0. The new handoff screen and full-table END marker await device observation; no UFS DMA/root success claimed.",
  "Prepared t970-ufs-handoff=1: corrected board-local SM8250 clock diagnostics from Samsung gcc-kona.c, removed SM8550-only memory-PHY GDSC reads, capture all bounded raw SMR/S2CR slots and guarded read-only HCI/queue state. No clock, PHY, SCM, SMMU, DMA or queue writes; use the exact tested baseline FD. Host and device results remain separate.",
  "Compared current T733 (SM7325) and umi (SM8250) public sources and maintainer-reported hardware results. T970 still inherits SM8550 clock diagnostic offsets; Samsung gcc-kona.c and umi agree on different SM8250 offsets. Current BoardInit skips GCC writes, so this is not proof of a reset cause. Public T733 firmware integration exists; no foreign SID or firmware was applied.",
  "User confirmed and photographed the expected T970 SMMUv2 RO stop for BOOT 7f729c2a: sCR0=002d0406 ID0=4c017e57 ID1=6000004a ID2=00005111 GFSR=0; 87 groups scanned, 74 context banks, no candidate match for 0060/00e0/04e0. MMIO observation is confirmed; SMR writability, actual UFS routing, DMA and root reads are not.",
  "Prepared BOOT 7f729c2a6ee8ee11b6eb5d4ff7ec23171b261854151578e36737d866a62391e2 from source 23d54b9 and kernel cca9bbb8. Independent FAT/kernel/arguments and packed FD checks passed, as did nine host tests and CPU0 DT/ADT checks. Patched Heimdall uploaded BOOT only with exit 0; device screen/register observation is pending. This is not a UFS/DMA/root-volume success.",
  "Resumed at 47b113f. New default diagnostic t970-smmu-report=1 reads the measured SMMUv2 window before any controller/queue/DMA/root setup and stops on a labeled panic. It retires the unflashed all-slot write scan, separates sCR0 from ID0/1/2, honors EXIDS, and does not treat ignored writes or prior SCM markers as proof that secure-world routes are exhausted.",
  "Disabled board UFS/PHY reg and interrupt overrides now preserve the exact stock ranges, including ICE. No root/Data policy or XNU storage driver is enabled.",
  "Primary GPT headers and entry-array CRCs passed for all four inspected LUNs; their entries and byte offsets are saved in gpt.json.",
  "Linux block sysfs start/size values use 512-byte units, while this device's GPT LBAs use 4096-byte logical blocks; convert explicitly when comparing them.",
  "Step 2 catalog review found ShengUfs declares SM8550/sheng clock, SMMU and userdata-layout dependencies. It and RamBlock/VirtIO/VerifiedRoot remain unselected until a T970 storage/root policy and interfaces are established.",
  "Step 6 storage inventory resolves the UFS controller (0x1d84000+0x3000 and ICE 0x1d90000+0x8000), QMP PHY v4 (0x1d87000+0xe000), all nine clock names to kona IDs (UFS_PHY_AXI 167, AGGRE_UFS_PHY_AXI 6, UFS_PHY_AHB 166, UNIPRO 179, ICE 170, TX/RX symbol clocks, RPMH_CXO 0), reset core_reset=GCC_UFS_PHY_BCR(33) and every regulator phandle; the stock UFS node has no iommus property.",
  "ShengUfs is not selected: it is scoped to the SM8550 controller with a 0x1d80000/0x2000 PHY, SM8550 clock policy, a fixed apps-SMMU stream 0x60 and sheng userdata LBAs. The T970 controller base matches but the PHY window, ICE block, SMMU ownership and userdata geometry do not.",
  "No SM8250/kona UFS implementation exists in the reviewed repositories: the shared SoC DTSI only declares disabled ufs/ufsphy nodes, and the SM8250 pipa port carries only package/SmmuBypass.h. UFS therefore stays disabled; storage remains planned pending a real driver port.",
  "Reviewed the SM8250 ports on unixnu.com/zh/devices: umi (Mi 10) has Native UFS, both root volumes and writable Data with launchd running; alioth (Redmi K40) marks storage device-verified using a device fork FFT-infra/NativeUfs-alioth pinned through feeds.toml; kebab reaches an HFS root; pipa is still stuck at root mount.",
  "The shared technique is firmware state takeover, not cold init: NativeUfs reads GCC gating and link state without writing clocks/reset/PHY, plans the two SM8250 UFS streams 0x0e0 and 0x4e0 from SMR/S2CR readback, and publishes a per-device userdata window. T970 uses the same controller 0x1d84000 and PHY 0x1d87000, so the umi/alioth driver is the concrete base for this port instead of ShengUfs SM8550 constants.",
  "Started the SM8250 UFS port by pinning feeds.toml ShengUfs to FFT-infra/NativeUfs-alioth@ab54059 (device-verified storage fork, streams 0x0e0/0x4e0). The component compiled; the kernel link then required the original IOStorageFamily absolute bindings (scripts/build-storage-bindings.py plus scripts/data/native-storage-original-bindings.S, both stored here) and the VerifiedRoot vr_* archive.",
  "Enabling the driver is blocked on two inputs that do not exist yet: the signed VerifiedRoot policy archive (build-verified-root-probe.py needs the OS-volume verification bundle, not just the IPSW) and a sheng userdata manifest that findRootLayout accepts; the T970 GPT is an Android layout. The integration is therefore prepared but disabled; CONFIG_XNU_NATIVE_UFS stays off and board components/archives are unchanged.",
  "Built the T970 userdata-root image from the 21H461 IPSW with the board GPT geometry (LBA 2969600..62458874, 4096-byte blocks): OS e5634d04 at 0x100000 and SystemOS b4908cde at 0x16a600000, image fd43ee70, 9382658048 bytes. Added [userdata] and payload.adt root_match_volume_uuid 04769D26-2CA0-4825-B443-E2E5F88300F2.",
  "The VerifiedRoot path cannot fit this board: the OS+SystemOS policy bundle embeds a 47 MiB block-hash table in the kernel (kernel.macho 125374464 bytes) and the packed boot image measured 138211328 bytes against the 71303168-byte BOOT partition. CONFIG_XNU_NATIVE_UFS and CONFIG_XNU_VERIFIED_ROOT_PROBE are therefore left off; the next storage step is a T970 device-side UFS publication path that does not embed the verified-root hash table.",
  "Provisioned the T970 userdata partition without Odin: scripts/encode-userdata-sparse.py encodes one contiguous segment of userdata-root.img as an Android sparse image whose DONT_CARE chunks leave the rest of the partition untouched, so three segments of ~2.8-3.1 GB each fit Heimdall's 4 GiB single-file protocol limit. All three uploads reported USERDATA upload successful.",
  "Enabled ShengUfs on the alioth fork with the empty-policy VerifiedRoot archive (19 KB, native policy count zero) and single default stream sid 0x0060. The kernel links and boots (kernel a981a22d, boot image c38d09f7). The driver reaches the SMMU setup but the SMR write for bank 73 slot 86 reads back zero, so UFS publication still fails at NativeUfs.cpp:455; the firmware-configured stream id or SMMU ownership is not yet identified.",
  "A t970-smmu-dump boot-argument diagnostic in arm_init (patches/xnu/t970-smmu-dump.patch) dumps the firmware-configured apps_smmu table before IOKit starts: IDR0 0x002d0405 and 26 valid SMR entries, none with SID 0x0060. The alioth driver then plans bank 73 slot 86 and its SMR write reads back zero, which points at SMMU power/clock or secure ownership rather than a missing stream id.",
  "The firmware DSC still states 'no UFS driver yet', and the ShengUfs hostBringUp only maps the controller: it assumes the boot firmware already powered UFS, the PHY and apps_smmu. On T970 the SMMU stream writes do not stick (SMR reads back zero) and the IDR reads vary between boots, so the driver cannot create the bypass context it needs. The vendored board copy in package/ShengUfs (IDR at 0x0/0x4/0x8 and a 0x820 attempt) is kept for the next step but is not selected in the archive list.",
  "NativeUfs/ShengUfs reuse is not enough for T970 on its own: slot 4 is a wildcard SID mapping (mask 0x402) that the driver refuses, and the firmware-configured UFS stream has not been identified among the 26 entries.",
  "The vendored ShengUfs copy with IDR at 0x0/0x4/0x8 and an auto-reuse scan of every exact stream still fails: the planner rejects the block with 'SMMU AArch64 stage 1 unsupported' because IDR0 bit 30 is clear on T970. The alioth/SM8550 SMMU register model therefore does not describe SM8250 apps_smmu; a correct SM8250 SMMU implementation (or firmware-side stream setup) is required before UFS can publish the partition.",
  "Restoring the Linux-validated SMMU model (IDR at 0x20/0x24/0x28, NUMSMRG/NUMCB geometry) showed the vendored driver's original offsets were correct; the failure is that no firmware stream is reusable and an SMR write for a new bypass context reads back zero. This is consistent with the secure world owning the stream registers on T970.",
  "Kernel-side SMMU programming is therefore not a viable path on this board: the storage driver needs the firmware to leave a bypass stream for UFS, which is what the alioth/T733 firmware does and what the Mu-Silicium T970 build does not.",
  "Keeping the SMMU map but disabling SMMU programming (t970-ufs-no-smmu=1) moves the failure past the SMMU panics and into an unexplained self-reset before console output. That is consistent with the driver's unbounded UFS completion loops waiting on DMA that the firmware stream mapping does not cover; kernel-side SMMU bypass alone is not sufficient.",
  "Route B started: scripts/gen-ufs-phy-tables.py extracts the SM8250 QMP UFS PHY sequences from the Linux driver into package/firmware/.../PlatformUfsLib/Sm8250UfsPhyTables.h (SM8150 base tables plus the SM8250 HS-G4 overlays, 24/6/34/7 and 1/21/2 entries). Wiring PlatformUfsLib and the Samsung UfsDxe is the next step and no firmware behaviour has changed yet.",
  "Both non-secure routes to a usable UFS SMMU context are now exhausted: kernel writes to the SMR are ignored, UEFI firmware PHY bring-up succeeds but UFS DMA still resets the board, and QCOM_SCM restore_sec_cfg is not provided by this platform's secure monitor.",
  "The UEFI image survey (t970-ufs-image=1) completed on hardware after the full userdata rewrite: 14 UFS reads, healthy=1, poisoned=0, and all seven manifest/OS/SystemOS samples matched (matchMask=0x7f). It reuses the firmware SMMU handoff context (CB0 0x100ff, SCTLR 0xe0, existing SMR entries) and stops with noPublication=1, so no block device or root is published.",
  "The working UFS reads reuse the firmware handoff state rather than a driver-created SMMU context: CB0 with cbar=0x100ff, cba2r=1, sctlr=0xe0 and the firmware SMR entries for SID 0x0e0/0x4e0 in slots 55/56, with the DMA buffer inside the owned window. This is the configuration the root publication must reuse.",
  "Connected that handoff to the production publication path (t970-ufs-publish=1): hostBringUpHandoff maps the controller and SMMU, takes DMA inside the DarwinBoot owned window, requires the exact reviewed firmware state (CB0 0x100ff/0x1/0xe0, 0x810 0x84020820, 0xc10 4, 0x954 0x800000e0, 0x958 0x800004e0, zero tails, GFSR/FSR zero) and then runs the survey's NOP/power/TUR sequence without writing the SMMU, the queue registers or storage. startRoot keeps every window fail-closed, so a rejected window publishes nothing.",
  "The kernel still links the empty policy table, and the policy bundle cannot be moved into it: the OS window needs about 46.4 MB of block hashes and SystemOS about 25.2 MB (32 bytes per 4096-byte block), so the packed boot image would exceed the 71303168-byte BOOT partition. The carrier therefore has to move out of the kernel; the planned shape is both manifests in a fixed userdata region after the image, read at boot through the same handoff transport and verified by the compiled-in owner key before the policy table is filled.",
  "The first publication image (BOOT 3b0d7d73) was refused on hardware by its own precondition: CB0 was still active (0x100ff/0x1/0xe0), GFSR 0, but the two parked SID entries 0x954/0x958 read zero and CB0 FSR read 0x400. The survey's healthy() snapshot was a state the survey itself had written (its NOP test parks SID 0x0e0/0x4e0 there) and FSR400 predates the kernel, so the snapshot was the wrong premise. The gate now checks fault drift around its own commands instead of a boot-specific snapshot, and the state words are reported without deciding.",
  "Its successor (BOOT 11a1d635) hung at the magenta loader bar with no panic text, which under t970-novc means a stall: the handoff path proved the transport without taking over the request list, so UTRLBA still addressed the firmware buffer and the first doorbell made the controller fetch foreign descriptors. The survey never hit this because its own NOP test halts the queue, writes UTRLBA/UTRLBAU to the owned DMA and restarts it. hostBringUpHandoff now performs that takeover and still writes no SMMU register.",
  "BOOT ca021c28 (handoff bring-up reusing the survey's t970_nop::run admission and NOP) reached the owner policy on hardware: the production reader validated the SHNGROOT manifest (status 0), planned both windows with the exact host geometry (OS 0x100000/6077580800, SystemOS 0x16a600000/3303014400) and published nothing because the linked policy table is empty (prepared=0 published=0, stage policy count invalid). The survey sequence is what makes this board work; the two hand-written bring-up variants before it either refused a state the survey itself had created or stalled the machine.",
  "The policy carrier therefore has exact inputs: 1483785 OS blocks and 806400 SystemOS blocks, 73285920 bytes of block hashes plus two manifests, against a 71303168-byte BOOT partition. The root image ends at LBA 5260288, so a fixed region from LBA 5505024 (about 18000 blocks) after the image is the candidate carrier, read at boot through the same handoff transport and authenticated by the compiled-in owner key before the policy table is filled.",
  "Implemented the carrier on both sides. Host: scripts/build-owner-root-manifests.py streams each window out of the sparse segments (no 9.4 GB file), signs it with the owner key through kits/VerifiedRoot/tools/manifest.py, and authenticates the result with the real C code (vr_host_open plus six sampled blocks). OS is 1483785 blocks / 47481664 bytes at LBA 5505024 and SystemOS 806400 blocks / 25805344 bytes at LBA 5516624, total 73287008 bytes; the OS UUID is the ADT root match 04769D26-2CA0-4825-B443-E2E5F88300F2 and the SystemOS UUID 8846FE78-2910-4297-AF97-D59BB6F8FC16 is the mounted cryptex volume UUID, which equals the kernel's XNU_OWNER_CACHE_VOLUME_UUID. Kernel: the linked table and count moved to .data and the real 395-byte owner key anchor is linked instead of zeros; installOwnerPolicyCarrier reads each envelope through hostRead4k, authenticates it with vr_open, and only then fills verified_root_policies, so a bad envelope still publishes nothing.",
  "Wrote both envelopes into the carrier region through the qualified recovery ADB channel (BOOT e67fe744): dd conv=fsync at LBA 5505024 and 5516624, block cache dropped, and the exact envelope bytes read back with matching SHA-256 (45a69e42 and 869da36d). Nothing outside the two ranges was written. The first readback compared whole 4096-byte blocks and failed only on the partial last block, so verification now hashes the exact envelope length.",
]
