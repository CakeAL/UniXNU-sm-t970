findings = [
  "BOOT5385b6ce owner photo03:00:42 shows three pending queues drained, MG done134, BB161, SB75->78, display open6/fail0/swap0. No constrained head means Q cap zero is absent data, not a measured cached limit. v22 reuses exact v21 kernel with existing stack mode1 to locate current BB/SB main waits; host image checks pass, hardware stack result pending.",
  "v21 BCM2837 EDGE width fallback uses registered SMP CPU/cluster counts only when E/P counts are both zero. Previous BOOT705d4160 has all eight ADT CPU cluster-type absent (SMP), cached constrained cap0 and callback progress. Actual prepared-function ASan/UBSan tests cover SMP1/8, E/P precedence and non-BCM guard; kernel/prelink/FAT checks pass. BOOT5385b6ce hardware result pending; this is not validated heterogeneous scheduling or desktop. See evidence/display/edge-smp-v21.",
  "UI-job-v8 kernel049897a9/BOOT1939b59d adds PID1 namei basename lookup counts and latest matching open error for BB/SB plists using existing kernel path copies only. Actual helper ASan tests cover filters/relative paths/errors/ring/bounds. Job lookup is not parsed/imported job proof; path/return association is best effort. Same eight-core60-second display diagnostics and policy. Hardware outcome pending; see evidence/display/ui-job-v8.",
  "BOOT3da265b4 target60 owner photo confirms main1/n67/cpu8/sec7, SpringBoard27/runningboardd26, Data0/policy0/stage4 and all-core positive timer/SGI snapshots. Backboardd not observed; free0x183 excludes reclaimable memory, not sole OOM proof. Sustained runtime, controlled CPU workload and desktop remain unverified. See runtime-cache60/device-result.json.",
  "Target45 BOOTbe219c43 owner photo confirms cpu8/sec7/main0/n2, blocks729210 and108 completed cache calls. Latest openat successfully opens final numbered subcache52.dyldlinkedit; recent open/fcntl errors0. Last signature-registration return and shared mapping not yet observed. Same-kernel target60 BOOT3da265b4 prepared, independently checked and uploaded BOOT-only with exit0; see runtime-cache45/device-result and runtime-cache60. No authorization changes or completed-main claim.",
  "Target30 BOOT79a949b6 shows cpu8/sec7/main0/n2, blocks546747 and82 completed cache syscalls, latest openat subcache39 with error0; recent fcntl97 signature registration also succeeds. Host SystemOS inventory has52 numbered subcaches;40..52 logical bytes989839360. Same-kernel target45 be219c43 prepared to observe mapping/main progress; no authorization or signature behavior changes.",
  "Same-kernel eight-core target20 image0dba26bc reproduces cpu8/sec7/secondary phase7/C4 and main0/n2. Verified blocks371515 versus189168 at target10 suggests continued reading across comparable boots. CPU5 timer2 observed; CPU4/6/7 timer0. Added optional compact runtime view of existing completed PID1 cache syscalls at target30 to localize startup without changing authorization or syscall behavior.",
  "BOOTd95c45d9 owner photo confirms8 available CPUs/sec7, every secondary phase7/PSCI0/fail0/C4, and positive SGI counts on all8 cores (54/62/59/26/6/24/2/1,total234). At target10, timers onCPU4/5/7 are0 and main0/n2. Eight-core startup and per-core SGI reception observed; all-core timer workload, sustained SMP, isolated bidirectional IPI and userspace remain unverified.",
  "BOOT1c778e4b owner photo confirms actual SGI reception on both CPUs:44/102,total146, CPU1 check99->102 after inline asm separator repair. Fixed-sender bidirectional isolation and sustained userspace remain unverified. Owner explicitly requested skipping4-core: same-kernel8-core BOOTd95c45d9 prepared, independently checked and uploaded; device result pending. Non-atomic sec aggregate is not sole core-online evidence.",
  "Actual old ArmCpu object/kernel lacked ICC_SGI1R_EL1 writes: semicolon-separated multi-instruction inline asm emitted only initial instruction under reviewed Apple arm64 assembler. Independent componentb5f9775 uses explicit newlines in17 strings. Old kernel negative control rejects; new object/kernel/payload checks confirm SGI writes/barriers, GIC/timer ISBs, DAIF and counter reads. BOOT1c778e4b uploaded with explicit local component override; default catalog/feed9066 unchanged. Hardware delivery pending; unused redistributor experiment not flashed.",
  "BOOT7e60f7c9 after owner reboot reproduces two CPUs/phase7/timers and matching TTBR1. Explicit SGI0 test observed attempt1/sent2/test1/recv0/cpu1=0>0 and target redistributor found1. Standard SGI delivery remains unqualified; sender thread is not pinned, so a future single receive would not independently prove bidirectional IPI. Do not promote8-core yet.",
  "BOOT6fe3e519 owner photo confirms cpu2/sec1, secondary phase7/C4, per-core timers22925/22334 and matching TTBR1=c4325000. This qualifies two-core startup/timers after reset publication; both SGI counts remain0. Added optional one-SGI0/100ms-yield plus existing read-only GIC snapshot before expanding core count. Actual IPI and8-core unverified.",
  "BOOT36c2f602 device records CPU1 pre-branch TTBR1=0 versus primary c4325000. T733 ArmCpu55cc0617 explicitly cleans cpu_ttep and sysreg_restore; previous comparison missed these ranges. Added an opt-in board qualification clean of these exact live objects in cpu_start before platform wake, preserving values/default behavior. Runtime fix remains to be verified.",
  "BOOTb44e4108 owner photo observes CPU1 milestone9 after MMU enable, with main0/n2 at target10. Added pre-branch register capture and first high-entry store through the already-used physical record alias to distinguish fetch from diagnostic-address failures. Actual transition and hardware page tables remain unverified.",
  "BOOT95accf53 owner photo confirms CPU1 entry3 (matched CPU data and reached common_start boundary); C marker4 not seen. Target10 snapshot main0/n2 is earlier than old120 samples. Added secondary-only common/TCR/table/SCTLR/trampoline markers without changing CPU setup values. See entry-trace/device-result.json and MMU trace records.",
  "Two-core BOOT9d4dc888 observed main1 and106 processes but one CPU available; CPU1 phase4/PSCI0/timer0/SGI0. Reset table, CPU1 affinity and reset handler match. Entry execution remains unconfirmed. Added four diagnostic entry milestones and shortened future target wait to10 seconds; default CPU0 unchanged,8-core not uploaded. See evidence/cpu and docs/smp-bringup.md; source/build checks are not hardware SMP qualification.",
  "Uploaded deliberate after-MMU BRK control 150ed5ff9d73d81b17d3f6d32e609b9a9e42fdfe0397da7c5eea7d62f7ce7b4d, using patched Heimdall, exit 0. The device reset at about 50 seconds, matching the reviewed BRK path; original BOOT restoration is still pending. C startup and console behavior are not exercised.",
  "After-MMU BRK control image prepared and extracted from FAT: BRK word, unchanged PE_create_console call, guard bytes, vector branches and preserved IRQ/FIQ slots verified. Eight host tests passed; hardware BRK delivery and the ~50-second timed reset were observed.",
  "Prepared isolated BRK #0 after-MMU-control image 150ed5ff9d73d81b17d3f6d32e609b9a9e42fdfe0397da7c5eea7d62f7ce7b4d; the FAT kernel was independently extracted and the probe instruction at 0xfffffff0073f3370 matches the intended probe. The device reset at about 50 seconds, confirming the deliberate BRK reached the bounded fault terminal.",
  "Added explicit after-MMU BRK control mode to qualify diagnostic execution before C startup. It preserves PE_create_console call bytes, uses the same reviewed fault handlers, and expects the distinct 50-second BRK path. Device execution and fault routing remain unverified until observed.",
  "Guarded image e18c6ca0e905e0e40a2283447a765bdc322bbcc85bf0cb19fe80ec857007be29 did not reset within 60 seconds. Neither PE_create_console return nor a fault terminal is established. Next is a deliberate after-MMU BRK control to qualify the diagnostic path independently of C startup; no spin-loop diagnosis is claimed.",
  "Uploaded guarded PE_create_console return probe e18c6ca0e905e0e40a2283447a765bdc322bbcc85bf0cb19fe80ec857007be29, using patched Heimdall, exit 0. Measured outcome and original BOOT restoration remain pending. Fault outcomes classify early paths and do not by themselves identify the failing function.",
  "Host checks for guarded PE_create_console return passed: eight tests, verified 112-byte guard code and all modified vector/panic branches inside the actual FAT kernel, with IRQ/FIQ/reserved slots unchanged. Runtime outcome and device BRK control remain unverified.",
  "Prepared isolated _PE_create_console after-return image e18c6ca0e905e0e40a2283447a765bdc322bbcc85bf0cb19fe80ec857007be29; the FAT kernel was independently extracted and its branch at 0xfffffff0079b619c matches the intended probe. This preparation record does not establish a device result; see the separately recorded observation for this image hash.",
  "Added an opt-in early-fault diagnostic restricted to PE_create_console return in arm_init on repaired kernel bfb50a1a. It verifies the compiled active-vector selection, preserves IRQ/FIQ/reserved slots, and terminates sync/SError/panic/BRK paths at 20/30/40/50 seconds. This is not a normal kernel, text/register log or device fault result.",
  "Repaired PE_init_printf(TRUE) return checkpoint was not observed (f759eb8085bb67c4a1d2ac02ea18898e6d146118fc790148638f33cfc81cd9a7). User photo shows retained firmware/loader text and entry bars, not a confirmed XNU text log. Restored PE_create_console may stop earlier; old-kernel gc_enable localization cannot be assumed for this new kernel.",
