]
inputs = [
  "Power-supply devices include max77705-charger, max77705-fuelgauge, pca9468-charger and sec-direct-charger.",
  "MAX77705 is at I2C bus 2 address 0x66 and PCA9468 at 0x57, behind controller 0x980000.",
  "The battery snapshot reports Li-ion, capacity=100, voltage_now=4252000, temp=289 and charge_full_design=10090000; raw vendor values are preserved without assuming units.",
  "Android exposes power states freeze/mem and mem_sleep choices s2idle/[deep]; CPU/GPU/DDR/WLAN thermal-zone names are recorded.",
]
configuration = [
  "Board regulator, RPMh and power-supply declarations are preserved in the live DT; no XNU power policy is configured.",
]
procedure = [
  "Read selected power-supply attributes, available sleep states and thermal-zone names; do not write charging, regulator or suspend controls.",
]
findings = [
  "The v116 diagnostic archive keeps the existing power paths and adds a separate mode 13 software table walk that issues no GPU rail or clock votes.",
  "v104 keeps the established battery and charger arguments while sampling GPU power handoff through GCC and qualified GPUCC reads.",
  "v98 BOOT749b7419 fixes the false kick failure: WDTCLR is self-clearing, so bits1:0 read back zero after a successful kick. The action now verifies only the preserved CNFG_06 bits7:2; a write NACK leaves CHG_EN on (the unkicked watchdog stops charging by itself) and a preserved-bit change clears CHG_EN. On BOOT749b7419 the kick fix holds: charge=kicked, CNFG_09 stays 0xbb, CHG_DTLS=1 with CHG_OK set, and the charger reports charging over 47 samples with zero errors. The gauge current remains negative (-215625uA) while SOC/capacity/voltage drift upward, so the gauge current sign is not yet reconciled with the charger state and Amperage is not yet suitable for time estimates. The later v100 photo shows +17968uA with CHG_DTLS=1, but v101 is -277343uA at the same charger state, so the gauge current sign is not a reliable indicator yet and Amperage stays out of time estimates.",
  "v97 BOOT96ff33b6 arms a guarded charge action behind the t970-charge=1 boot argument. Each 5 s read re-checks battery presence, 0..45C, 3.0..4.35V and CHGPROT unlocked, sets CHG_EN (CNFG_09 bit7) when clear, and writes WDTCLR (CNFG_06 bits1:0) to kick the watchdog; every write is read back and a failed kick or guard clears CHG_EN again. The bootloader charge profile (1500mA, 1500mA input, 4.35V) is left untouched. The report adds charge= to the Battery svc line. On BOOT96ff33b6 CHG_EN reads 0xbb and the charger reports CHG_DTLS=1 with CHG_OK set, so the enable write works; however charge=kick-failed and CNFG_06 still 0xec show that the WDTCLR readback is self-clearing (bits1:0 always zero after a kick). The code compared the whole byte with 0xed, restored CHG_EN each cycle and left charging flapping at 5 s intervals (-264mA average). The kick check, not the charger, was wrong.",
  "v96 BOOT3ce997f2 extends the same 5 s read with the charger configuration words CNFG_00/02/04/06/09 (WDTEN, CHG_EN, CHG_CC, CHGIN_LIM, float-voltage code) and prints them as Charger cfg. The added five reads keep the path read-only, and a failed configuration read marks that line partial without changing the sample validity. On BOOT3ce997f2 the line is 15/5e/13/ec/3b: mode already 0x5 (BUCK+CHG), 1500mA charge current, 1500mA input limit, CNFG_04 code 19 meaning 4350mV, CHGPROT unlocked, but CHG_EN is clear. Charging is therefore disabled by CHG_EN even before the watchdog expiry; WDTEN remains set and unkicked. No charger register has been written.",
  "v95 BOOT01e85687 adds the read-only T970Battery IOPMPowerSource. bsd_init registers the class behind t970-battery=1, the worker waits for IOBSD and polls the existing bounded GPIO I2C path every 5 s, and the archive carries the object beside the PMGR bridge. Complete samples update capacity/voltage/current/temperature/external/charging; incomplete samples keep the previous fields and set MAX77705ReadIncomplete. The terminal report formats the last committed sample plus Battery svc counters and does not start a transfer in the panic path. On BOOT01e85687 the photo shows Battery svc samples48 errors0 published1 age1.87s, six percent/temperature/capacity fields recomputable from the raw words, and the status bar draws the battery glyph with Not Charging, matching external1/charging0. Charging stays off because CHG_DTLS remains the expired-watchdog value 0xB; charger writes and the IRQ are still out of scope.",
  "v92 BOOT43258b3c reports QUP0 SE0 vote0x041007c0, branch0x4220, masterAHB0, slaveAHB0x80000002,GPIO28/29 configs7/7 and high inputs. v93 BOOTbb5bd9d0 temporarily clears only slaveAHB HWCG and restores it: SE firmware0x303 means I2C protocol3/version3, FIFO enabled,status0. v94 BOOT6d5c4c60 qualifies this idle protocol before a bounded GPIO open-drain read of PMIC0x66, gauge0x36 and charger0x69; it restores GPIO mux/latches and does not write PMIC configuration. On device the gauge 15/02 returns all seven valid words (60.49%, 3925312 uV, 0 uA, 28199 mC, 5442/8787 mAh), each recomputable from its raw value, and GPIO/OE restore reads back 1. The charger reports CHGIN valid (b3 bits6:5=3, CHGIN_OK set) while b4&0xf=0xB is the vendor charger-watchdog-expired detail, so charging is inactive. This is one terminal-report sample: continuous refresh, stale/error handling and IOPMPowerSource publication are not implemented.",
  "Added opt-in t970-battery-ro=1 handoff inspection for QUP0 clocks and NORTH GPIO28/29. The observer maps read-only and skips SE0 register reads unless its SE and both AHB clocks report running with the expected votes. It sends no I2C transfers or charger writes; gauge/device results remain pending.",
  "The board uses MAX77705 on QUP0/SE0 at0x980000 via NORTH GPIO28/29; the MFD source creates gauge0x36 and charger0x69 behind PMIC0x66. A read-only measurement decoder now handles per-field validity, little-endian words, signed current/temperature and vendor fg_resistor=5 scaling. ASan/UBSan vectors cover 4250mV,75.5%,positive/negative current and temperature,10090mAh and absent/failed samples. It is not linked to a transport or OS battery service yet.",
  "v67 adds an opt-in root-domain watchdog panic detail with PM machine state, wait reason, current and requested power states, pending count and first pending service class. It also retains a 240-second frame report if no watchdog fires. Kernel prelink and final BOOT FAT checks pass. The device reaches target240 with a completed blank GOP fill 28 ms after the last normal CPU copy. No PM watchdog panic occurred before the report.",
  "v65 with noidle=1 still shows Hello and then turns black after about ten seconds. The owner photo shows no panic text. v66 uses the sleep-disabled ADT default also used on T733 and dada; it retains noidle and adds only that property to the tested payload.",
  "v64 owner photo confirms Sleep/Wake hang detected at IOPMrootDomain.cpp:12812. The linked stack reaches IOService::watchdog_timer_expired; this timer belongs to the PM root domain. The original triggering request and blocked child are unknown. v65 changes only noidle=1 on the continuous v63 image and preserves the power watchdog.",
  "Advertised Android sleep states and power-supply entries do not establish UniXNU suspend, charging support or physical presence of every listed supply type.",
]
completion = [
  "Battery units match measurements, charging and thermal controls operate correctly, and each supported sleep/resume transition restores dependent peripherals.",
]
limits = [
  "Vendor battery units, firmware ownership and state transitions remain unverified; The v64 panic identifies a PM timeout but does not establish suspend or resume functionality.",
  "The charger watchdog is expired on the measured boot, so charging is inactive while external power is present and the pack discharges at about 188 mA. Feeding or disabling the watchdog and configuring charge current/voltage are not implemented; v94/v95 deliberately perform no charger write. The status bar reflects the power source but the percentage text is not shown in this iPadOS configuration.",
]
next_action = ["Per the owner, start the brightness path: read the DSI handoff state and the S6TUUM3 normal-brightness command/mapping, then validate raw min/mid/max before the OS slider. Separately reconcile the gauge current sign with charging when convenient."]
